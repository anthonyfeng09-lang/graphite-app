    if(pos.col<NUM_COLS-1){ ev.preventDefault(); input.blur(); sheetMoveTo(indexToCol(pos.col+1)+pos.row); }
  } else if(ev.key==='ArrowLeft' && input.selectionStart===0 && input.selectionEnd===0){
    if(pos.col>0){ ev.preventDefault(); input.blur(); sheetMoveTo(indexToCol(pos.col-1)+pos.row); }
  }
}

function sheetBuildGrid(){
  var table=document.createElement('table'); table.className='sheet-table';
  var thead=document.createElement('thead');
  var htr=document.createElement('tr');
  var corner=document.createElement('th'); corner.className='sheet-corner'; htr.appendChild(corner);
  for(var c=0;c<NUM_COLS;c++){ var th=document.createElement('th'); th.textContent=indexToCol(c); htr.appendChild(th); }
  thead.appendChild(htr); table.appendChild(thead);
  var tbody=document.createElement('tbody');
  for(var r=1;r<=NUM_ROWS;r++){
    var tr=document.createElement('tr');
    var rowHeadTd=document.createElement('td'); rowHeadTd.className='sheet-rownum'; rowHeadTd.textContent=String(r);
    tr.appendChild(rowHeadTd);

      var ref=indexToCol(c2)+r;

      });
      input.addEventListener('keydown', function(ev){ sheetHandleCellKeydown(ev, this); });
      td.appendChild(input);
      tr.appendChild(td);
      cellInputs[ref]=input; cellTds[ref]=td;
      cells[ref]={raw:''};
    }

  }

sheetBuildGrid();

/* seed demo content */
cells['A1'].raw='1'; cells['A2'].raw='2'; cells['A3'].raw='3'; cells['A4'].raw='4';
cells['B1'].raw='=A1*2'; cells['B2'].raw='=A2*2'; cells['B3'].raw='=A3*2'; cells['B4'].raw='=A4*2';
cells['A6'].raw='Total'; cells['B6'].raw='=SUM(A1:A4)';
cells['A7'].raw='Average'; cells['B7'].raw='=AVERAGE(A1:A4)';

sheetSelect('A1');

var sheetFormulaInputEl=document.getElementById('sheetFormulaInput');
sheetFormulaInputEl.addEventListener('keydown', function(ev){

    sheetCommitInput(selectedRef, sheetFormulaInputEl.value);

    if(input) input.value=sheetFormatValue(cells[selectedRef]);
  }

sheetFormulaInputEl.addEventListener('blur', function(){

window.sheetOnShow=function(){};
window.__debugSheetCells=cells;
})();

    var sw=document.createElement('button'); sw.className='swatch-btn';
    sw.style.setProperty('--dot-color', row.color); sw.style.setProperty('--dot-fill', row.text.trim()?row.color:'transparent');
    sw.style.pointerEvents='none';
    wrap.appendChild(sw);
    var main=document.createElement('div'); main.className='expr-main';
    var inputWrap=document.createElement('div'); inputWrap.className='expr-input-wrap';
    var input=document.createElement('input'); input.className='expr-input mono'; input.type='text';
    input.spellcheck=false; input.autocomplete='off'; input.placeholder='f(x) = ...';
    input.value=row.text;
    input.addEventListener('input', function(){
      row.text=input.value;
      var wasLast = fnRows[fnRows.length-1]===row;
      tableEnsureTrailingBlank();
      if(wasLast && fnRows[fnRows.length-1]!==row){
        var caret=input.selectionStart;
        renderFnList();
        var el=tableFnListEl.querySelector('[data-id="'+row.id+'"] .expr-input');
        if(el){ el.focus(); try{ el.setSelectionRange(caret,caret); }catch(e){} }
      }
      else { renderFnListPreserveFocus(); }
      tableRecompute();
    });
    input.addEventListener('keydown', function(ev){
      if(ev.key==='Enter'){
        ev.preventDefault();
        var i=fnRows.indexOf(row);
        var blank=mkFnRow('');
        fnRows.splice(i+1,0,blank);
        renderFnList();
        tableFocusRow(blank.id);
      } else if(ev.key==='Backspace' && input.value===''){
        var i2=fnRows.indexOf(row);
        if(fnRows.length>1){
          ev.preventDefault();
          fnRows.splice(i2,1);
          tableEnsureTrailingBlank();
          renderFnList(); tableRecompute();
          var prev=fnRows[Math.max(0,i2-1)];
          if(prev) tableFocusRow(prev.id);
        }
      }
    });
    var inputStack=document.createElement('div');
    inputStack.className='expr-input-stack';
    inputStack.appendChild(input);
    var pretty=document.createElement('div');
    pretty.className='expr-pretty mono';
    inputStack.appendChild(pretty);
    var updatePretty=function(){ pretty.innerHTML=window.formatMathPretty ? window.formatMathPretty(row.text) : row.text; };
    updatePretty();
    if(row.text.trim()!=='') pretty.classList.add('visible');
    input.addEventListener('input', updatePretty);
    input.addEventListener('focus', function(){ pretty.classList.remove('visible'); });
    input.addEventListener('blur', function(){
      updatePretty();
      if(row.text.trim()!=='') pretty.classList.add('visible'); else pretty.classList.remove('visible');
    });
    inputWrap.appendChild(inputStack);
    var actions=document.createElement('div'); actions.className='expr-row-actions';
    if(fnRows.length>1 && row.text!==''){
      var delBtn=document.createElement('button'); delBtn.className='row-btn'; delBtn.title='Delete';
      delBtn.innerHTML='<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 3.5h9M5.3 3.5V2.2h3.4v1.3M3.6 3.5l.5 8.3h5.8l.5-8.3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      delBtn.addEventListener('click', function(){
        var i=fnRows.indexOf(row);
        fnRows.splice(i,1);
        tableEnsureTrailingBlank();
        renderFnList(); tableRecompute();
      });
      actions.appendChild(delBtn);
    }
    inputWrap.appendChild(actions);
    main.appendChild(inputWrap);
    if(row.error){
      var err=document.createElement('div'); err.className='expr-error'; err.textContent=row.error;
      main.appendChild(err);
    }
    wrap.appendChild(main);
    wrap.dataset.id=row.id;
    tableFnListEl.appendChild(wrap);
  });
}
function renderFnListPreserveFocus(){
  // lightweight: update swatch fill + error display without a full rebuild
  // (a full rebuild while a row has a parse error - which happens mid-typing,
  // e.g. right after "a*" before the "x" arrives - would steal focus)
  Array.from(tableFnListEl.children).forEach(function(el){
    var id=el.dataset.id;
    var row=fnRows.find(function(r){return r.id===id;});
    if(!row) return;
    var sw=el.querySelector('.swatch-btn');
    if(sw) sw.style.setProperty('--dot-fill', row.text.trim()?row.color:'transparent');
    el.classList.toggle('is-error', !!row.error);
    var main=el.querySelector('.expr-main');
    var errEl=el.querySelector('.expr-error');
    if(row.error){
      if(!errEl){ errEl=document.createElement('div'); errEl.className='expr-error'; main.appendChild(errEl); }
      errEl.textContent=row.error;
    } else if(errEl){
      errEl.remove();
    }
  });
}
function tableFocusRow(id){
  requestAnimationFrame(function(){
    var el=tableFnListEl.querySelector('[data-id="'+id+'"] .expr-input');
    if(el) el.focus();
  });
}

function tableRecompute(){
  var min=parseFloat(tableMinEl.value), max=parseFloat(tableMaxEl.value), step=parseFloat(tableStepEl.value);
  if(isNaN(min)) min=-5; if(isNaN(max)) max=5; if(isNaN(step)||step<=0) step=1;
  var xs=[];
  var n=Math.min(500, Math.floor((max-min)/step+1e-9)+1);
  if(n<0) n=0;
  for(var i=0;i<n;i++) xs.push(min+i*step);

  var baseScope = window.__debugScope ? window.__debugScope() : {};
  var eng=window.MathEngine;
  var compiled=[];
  fnRows.forEach(function(row){
    row.error=null;
    var text=row.text.trim();
    if(!text){ compiled.push(null); return; }
    try{
      var ast=eng.parseExpression(text);
      var fn=eng.compile(ast,{});
      compiled.push(fn);
    }catch(e){
      row.error=e.message||String(e);
      compiled.push(null);
    }
  });

  var table=document.createElement('table'); table.className='value-table';
  var thead=document.createElement('thead'); var htr=document.createElement('tr');
  var xth=document.createElement('th'); xth.textContent='x'; htr.appendChild(xth);
  fnRows.forEach(function(row,idx){
    if(!row.text.trim()) return;
    var th=document.createElement('th');
    th.style.color=row.color;
    th.innerHTML=window.formatMathPretty ? window.formatMathPretty(row.text) : row.text;
    htr.appendChild(th);
  });
  thead.appendChild(htr); table.appendChild(thead);
  var tbody=document.createElement('tbody');
  xs.forEach(function(x){
    var tr=document.createElement('tr');
    var xtd=document.createElement('td'); xtd.textContent=tableFormatNum(x); tr.appendChild(xtd);
    fnRows.forEach(function(row,idx){
      if(!row.text.trim()) return;
      var fn=compiled[idx];
      var td=document.createElement('td');
      if(!fn){ td.textContent='err'; }
      else{
        try{
          var scope=Object.create(baseScope); scope.x=x;
          var v=fn(scope);
          td.textContent=tableFormatNum(v);
        }catch(e){ td.textContent='err'; }
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableScrollEl.innerHTML='';
  tableScrollEl.appendChild(table);

  renderFnListPreserveFocus();
}
function tableFormatNum(v){
  if(!isFinite(v)) return v>0?'Infinity':(v<0?'-Infinity':'undefined');
  if(Math.abs(v)<1e-10) v=0;
  var s=Math.round(v*10000)/10000;
  return String(s);
}

tableAddRowEl.addEventListener('click', function(){
  var last=fnRows[fnRows.length-1];
  tableFocusRow(last.id);
});
[tableMinEl,tableMaxEl,tableStepEl].forEach(function(el){
  el.addEventListener('input', tableRecompute);
});

renderFnList();
tableRecompute();

window.tableOnShow=function(){ tableRecompute(); };
window.__debugTableRows=fnRows;
})();
</script>
<script>
(function(){
"use strict";
/* ============================== ON-SCREEN MATH KEYBOARD ============================== */
/* Works across Graphing/Table expression inputs, the Geometry command bar and the
   Spreadsheet formula bar. It never depends on those modes' internals - it just
   edits whichever plain text input last had focus and fires a normal 'input'
   event, so each mode's own listener picks the change up exactly as if the
   user had typed it. Calculator mode already has its own always-visible pad. */

var MK_SELECTOR = '.expr-input, #geoCommandInput, #sheetFormulaInput';
var mkLastInput = null;
var mkOpen = false;
var mkTab = 'Basic';

var mkBtn = document.getElementById('mathKbBtn');
var mkPanel = document.getElementById('mathKb');
var mkTabsEl = document.getElementById('mathKbTabs');
var mkGridEl = document.getElementById('mathKbGrid');

document.addEventListener('focusin', function(ev){
  var t = ev.target;
  if(t && t.matches && t.matches(MK_SELECTOR)){
    mkLastInput = t;
    if(mkOpen) t.setAttribute('inputmode','none');
  }
});

function mkPickFallback(){
  var els = document.querySelectorAll(MK_SELECTOR);
  for(var i=0;i<els.length;i++){
    if(els[i].getClientRects().length>0) return els[i];
  }
  return null;
}
function mkActiveEl(){
  if(mkLastInput && document.body.contains(mkLastInput) && mkLastInput.getClientRects().length>0) return mkLastInput;
  var fb = mkPickFallback();
  if(fb) mkLastInput = fb;
  return fb;
}
function mkInsert(text, caretBack){
  var el = mkActiveEl();
  if(!el) return;
  var start = (el.selectionStart===null||el.selectionStart===undefined) ? el.value.length : el.selectionStart;
  var end = (el.selectionEnd===null||el.selectionEnd===undefined) ? el.value.length : el.selectionEnd;
  el.value = el.value.slice(0,start) + text + el.value.slice(end);
  var pos = start + text.length - (caretBack||0);
  el.focus();
  try{ el.setSelectionRange(pos,pos); }catch(e){}
  /* Graphing/Table mode rebuild the whole row list on every 'input' event
     (see handleTextChange -> renderList), which destroys this element and
     re-focuses a fresh one via a single requestAnimationFrame - clobbering
     any mid-string caret position we just set. When that applies, re-apply
     the caret on the fresh element one frame after that rebuild's own
     refocus has run. */
  var isRebuiltRow = el.classList.contains('expr-input');
  var rowId = isRebuiltRow && el.closest('[data-id]') ? el.closest('[data-id]').dataset.id : null;
  el.dispatchEvent(new Event('input', {bubbles:true}));
  if(rowId!==null && caretBack){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        var fresh = document.querySelector('[data-id="'+rowId+'"] .expr-input');
        if(fresh){ fresh.focus(); try{ fresh.setSelectionRange(pos,pos); }catch(e){} }
      });
    });
  }
}
function mkBackspace(){
  var el = mkActiveEl();
  if(!el) return;
  var start = (el.selectionStart===null||el.selectionStart===undefined) ? el.value.length : el.selectionStart;
  var end = (el.selectionEnd===null||el.selectionEnd===undefined) ? el.value.length : el.selectionEnd;
  if(start===end && start>0){
    el.value = el.value.slice(0,start-1) + el.value.slice(start);
    start = start-1;
  } else {
    el.value = el.value.slice(0,start) + el.value.slice(end);
  }
  el.focus();
  try{ el.setSelectionRange(start,start); }catch(e){}
  el.dispatchEvent(new Event('input', {bubbles:true}));
}

var MK_TABS = {
  Basic: [
    {l:'7',v:'7'},{l:'8',v:'8'},{l:'9',v:'9'},{l:'÷',v:'/',cls:'op'},{l:'DEL',act:mkBackspace,cls:'del'},
    {l:'4',v:'4'},{l:'5',v:'5'},{l:'6',v:'6'},{l:'×',v:'*',cls:'op'},{l:'(',v:'('},
    {l:'1',v:'1'},{l:'2',v:'2'},{l:'3',v:'3'},{l:'−',v:'-',cls:'op'},{l:')',v:')'},
    {l:'0',v:'0'},{l:'.',v:'.'},{l:'=',v:'=',cls:'op'},{l:'+',v:'+',cls:'op'},{l:',',v:','},
    {l:'x',v:'x',cls:'var'},{l:'y',v:'y',cls:'var'},{l:'x²',v:'^2'},{l:'x³',v:'^3'},
    {l:'xⁿ',act:function(){ mkInsert('^()',1); }},{l:'√',v:'sqrt('},{l:'π',v:'pi'},
    {l:'a/b',act:function(){ mkInsert('(/)',2); }}
  ],
  Functions: [
    {l:'sin',v:'sin('},{l:'cos',v:'cos('},{l:'tan',v:'tan('},{l:'ln',v:'ln('},{l:'log',v:'log('},
    {l:'sin⁻¹',v:'asin('},{l:'cos⁻¹',v:'acos('},{l:'tan⁻¹',v:'atan('},{l:'√',v:'sqrt('},{l:'∛',v:'cbrt('},
    {l:'|x|',v:'abs('},{l:'floor',v:'floor('},{l:'ceil',v:'ceil('},{l:'round',v:'round('},{l:'exp',v:'exp('},
    {l:'min',v:'min('},{l:'max',v:'max('},{l:'mod',v:'mod('},{l:'xʸ',act:function(){ mkInsert('^()',1); }},{l:'DEL',act:mkBackspace,cls:'del'}
  ],
  Symbols: [
    {l:'θ',v:'theta',cls:'var'},{l:'e',v:'e',cls:'var'},{l:'{',v:'{'},{l:'}',v:'}'},{l:'|',v:'|'},
    {l:'[',v:'['},{l:']',v:']'},{l:'<',v:'<',cls:'op'},{l:'>',v:'>',cls:'op'},{l:',',v:','},
    {l:'≤',v:'<=',cls:'op'},{l:'≥',v:'>=',cls:'op'},{l:'!',v:'!'},{l:'%',v:'%'},{l:':',v:':'},
    {l:'a',v:'a',cls:'var'},{l:'b',v:'b',cls:'var'},{l:'k',v:'k',cls:'var'},{l:'n',v:'n',cls:'var'},{l:'t',v:'t',cls:'var'}
  ]
};

function mkBuildTabs(){
  mkTabsEl.innerHTML='';
  Object.keys(MK_TABS).forEach(function(name){
    var b=document.createElement('button');
    b.className='mathkb-tab'+(name===mkTab?' active':'');
    b.textContent=name;
    b.addEventListener('click', function(){ mkTab=name; mkBuildGrid(); mkBuildTabs(); });
    mkTabsEl.appendChild(b);
  });
  var close=document.createElement('button');
  close.className='mathkb-close';
  close.setAttribute('aria-label','Close math keyboard');
  close.innerHTML='&times;';
  close.addEventListener('click', mkClose);
  mkTabsEl.appendChild(close);
}
function mkBuildGrid(){
  mkGridEl.innerHTML='';
  MK_TABS[mkTab].forEach(function(k){
    var b=document.createElement('button');
    b.textContent=k.l;
    if(k.cls) b.className=k.cls;
    b.addEventListener('click', function(){
      if(k.act) k.act(); else mkInsert(k.v);
    });
    mkGridEl.appendChild(b);
  });
}

function mkSetInputMode(on){
  var els=document.querySelectorAll(MK_SELECTOR);
  for(var i=0;i<els.length;i++){
    if(on) els[i].setAttribute('inputmode','none'); else els[i].removeAttribute('inputmode');
  }
}
function mkOpenPanel(){
  mkOpen=true;
  mkPanel.style.display='';
  mkBtn.classList.add('active');
  mkSetInputMode(true);
  var el=mkActiveEl();
  if(el) el.focus();
}
function mkClose(){
  mkOpen=false;
  mkPanel.style.display='none';
  mkBtn.classList.remove('active');
  mkSetInputMode(false);
}

mkBuildTabs();
mkBuildGrid();
mkBtn.addEventListener('click', function(){
  if(mkOpen) mkClose(); else mkOpenPanel();
});

window.__debugMathKb=function(){ return {open:mkOpen, tab:mkTab, lastInput:mkLastInput}; };
})();
</script>

</body>
