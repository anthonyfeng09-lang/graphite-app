/* ======================== INTERACTION =========================== */
/* ============================================================= */

var traceMarker=null;
var hoverRowId=null;
Object.defineProperty(window,'__debugHoverRowId',{get:function(){ return hoverRowId; }});
var dragPointRow=null;
var dragging=false, dragLast=null, dragMoved=false;

function findDraggablePointNear(px,py){
  var best=null, bestD=16;
  rows.forEach(function(row){
    if(row.error||row.hidden||row.isFolder||row.kind!=='point'||!row.isLiteralPoint) return;
    var s=mathToScreen(row.pointX,row.pointY);
    var d=Math.hypot(s.x-px,s.y-py);
    if(d<bestD){ bestD=d; best=row; }
  });
  return best;
}
function findNearestSample(px,py){
  var best=null, bestD=14;
  rows.forEach(function(row){
    if(row.error||row.hidden||row.isFolder||!row.lastSamples) return;
    row.lastSamples.forEach(function(s){
      var d=Math.hypot(s.sx-px,s.sy-py);
      if(d<bestD){ bestD=d; best={x:s.x,y:s.y,color:row.color}; }
    });
  });
  return best;
}

canvas.addEventListener('pointerdown', function(ev){
  if(ev.pointerType==='touch' && activeTouches.size>=1) return;
  var rect=canvas.getBoundingClientRect();
  var px=ev.clientX-rect.left, py=ev.clientY-rect.top;
  var dp=findDraggablePointNear(px,py);
  if(dp){ dragPointRow=dp; canvas.setPointerCapture(ev.pointerId); return; }
  dragging=true; dragMoved=false; dragLast={x:ev.clientX,y:ev.clientY};
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener('pointermove', function(ev){
  var rect=canvas.getBoundingClientRect();
  var px=ev.clientX-rect.left, py=ev.clientY-rect.top;
  var m=screenToMath(px,py);
  coordReadout.textContent='x: '+formatNum(m.x)+', y: '+formatNum(m.y);
  coordReadout.classList.add('visible');
  positionCoordReadout(px,py,rect);
  if(dragPointRow){
    dragPointRow.pointX=m.x; dragPointRow.pointY=m.y;
    dragPointRow.text='('+(Math.round(m.x*100)/100)+','+(Math.round(m.y*100)/100)+')';
    var input=exprListEl.querySelector('[data-id="'+dragPointRow.id+'"] .expr-input');
    if(input) input.value=dragPointRow.text;
    scheduleRender();
    return;
  }
  if(dragging && dragLast){
    var dx=ev.clientX-dragLast.x, dy=ev.clientY-dragLast.y;
    if(Math.abs(dx)>2||Math.abs(dy)>2) dragMoved=true;
    view.cx -= dx/view.scale;
    view.cy += dy/view.scale;
    dragLast={x:ev.clientX,y:ev.clientY};
    markInteracting();
    scheduleRender();
  }
});
function endDrag(ev){
  if(dragPointRow){
    var row=dragPointRow; dragPointRow=null;
    recompute(); renderList(); scheduleRender(); saveStateSoon(); pushHistory();
    return;
  }
  if(dragging){
    if(!dragMoved){
      var rect=canvas.getBoundingClientRect();
      var px=ev.clientX-rect.left, py=ev.clientY-rect.top;
      var near=findNearestSample(px,py);
      traceMarker = near || null;
      scheduleRender();
    }
    dragging=false; dragLast=null; saveStateSoon();
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', function(){ coordReadout.classList.remove('visible'); });

canvas.addEventListener('wheel', function(ev){
  ev.preventDefault();
  var rect=canvas.getBoundingClientRect();
  var px=ev.clientX-rect.left, py=ev.clientY-rect.top;
  var before=screenToMath(px,py);
  var factor=Math.pow(1.0016, -ev.deltaY);
  view.scale=Math.min(200000, Math.max(0.001, view.scale*factor));
  var after=screenToMath(px,py);
  view.cx += before.x-after.x;
  view.cy += before.y-after.y;
  markInteracting();
  scheduleRender();
  saveStateSoon();
}, {passive:false});

canvas.addEventListener('dblclick', function(ev){
  var rect=canvas.getBoundingClientRect();
  var px=ev.clientX-rect.left, py=ev.clientY-rect.top;
  var before=screenToMath(px,py);
  view.scale*=2;
  var after=screenToMath(px,py);
  view.cx += before.x-after.x;
  view.cy += before.y-after.y;
  scheduleRender(); saveStateSoon();
});

var activeTouches=new Map();
var pinchStartDist=null, pinchStartScale=null, pinchStartMid=null;
canvas.addEventListener('touchstart', function(ev){
  for(var i=0;i<ev.changedTouches.length;i++){
    var t=ev.changedTouches[i];
    activeTouches.set(t.identifier,{x:t.clientX,y:t.clientY});
  }
  if(activeTouches.size===2){
    dragging=false;
    var pts=Array.from(activeTouches.values());
    pinchStartDist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    pinchStartScale=view.scale;
    var rect=canvas.getBoundingClientRect();
    var midX=(pts[0].x+pts[1].x)/2-rect.left, midY=(pts[0].y+pts[1].y)/2-rect.top;
    pinchStartMid=screenToMath(midX,midY);
  }
}, {passive:true});
canvas.addEventListener('touchmove', function(ev){
  for(var i=0;i<ev.changedTouches.length;i++){
    var t=ev.changedTouches[i];
    if(activeTouches.has(t.identifier)) activeTouches.set(t.identifier,{x:t.clientX,y:t.clientY});
  }
  if(activeTouches.size===2 && pinchStartDist){
    ev.preventDefault();
    var pts=Array.from(activeTouches.values());
    var dist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    view.scale=Math.min(200000, Math.max(0.001, pinchStartScale*(dist/pinchStartDist)));
    var rect=canvas.getBoundingClientRect();
    var midX=(pts[0].x+pts[1].x)/2-rect.left, midY=(pts[0].y+pts[1].y)/2-rect.top;
    var nowMid=screenToMath(midX,midY);
    view.cx += pinchStartMid.x-nowMid.x;
    view.cy += pinchStartMid.y-nowMid.y;
    markInteracting();
    scheduleRender();
  }
}, {passive:false});
function touchEnd(ev){
  for(var i=0;i<ev.changedTouches.length;i++) activeTouches.delete(ev.changedTouches[i].identifier);
  if(activeTouches.size<2){ pinchStartDist=null; }
  if(activeTouches.size===0) saveStateSoon();
}
canvas.addEventListener('touchend', touchEnd);
canvas.addEventListener('touchcancel', touchEnd);

function positionCoordReadout(px,py,rect){
  var pad=14;
  var w=coordReadout.offsetWidth||90, h=coordReadout.offsetHeight||22;
  var left=px+pad, top=py+pad;
  if(left+w>rect.width-4) left=px-w-pad;
  if(top+h>rect.height-4) top=py-h-pad;

  if(top<4) top=4;
  coordReadout.style.left=left+'px';
  coordReadout.style.top=top+'px';
}

/* ---------------- inline prompt (replaces native window.prompt) ---------------- */
function askInline(title, fields, onSubmit, opts){
  opts=opts||{};
  var overlay=document.createElement('div');
  overlay.className='mini-prompt-overlay';
  var card=document.createElement('div');
  card.className='mini-prompt-card';
  var h=document.createElement('h3');
  h.textContent=title;
  card.appendChild(h);
  var inputs={};
  fields.forEach(function(f){
    var wrap=document.createElement('div');
    wrap.className='mini-prompt-field';
    var lbl=document.createElement('label');
    lbl.textContent=f.label;
    wrap.appendChild(lbl);
    var inp=document.createElement('input');
    inp.type='text';
    inp.value=f.value||'';
    if(f.placeholder) inp.placeholder=f.placeholder;
    if(f.readonly) inp.readOnly=true;
    wrap.appendChild(inp);
    card.appendChild(wrap);
    inputs[f.key]=inp;
  });
  var actions=document.createElement('div');
  actions.className='mini-prompt-actions';
  var cancelBtn=document.createElement('button');
  cancelBtn.className='list-toolbar-btn';
  cancelBtn.type='button';
  cancelBtn.textContent=opts.singleAction?'Close':'Cancel';
  var okBtn=document.createElement('button');
  okBtn.className='list-toolbar-btn primary';
  okBtn.type='button';
  okBtn.textContent=opts.submitLabel||'Save';
  actions.appendChild(cancelBtn);
  if(!opts.singleAction) actions.appendChild(okBtn);
  card.appendChild(actions);
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  function close(){
    if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
    document.removeEventListener('keydown', onKey, true);
  }
  function submit(){
    var values={};
    fields.forEach(function(f){ values[f.key]=inputs[f.key].value; });
    close();
    if(onSubmit) onSubmit(values);
  }
  function onKey(e){
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); close(); }
    else if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); if(opts.singleAction) close(); else submit(); }
  }
  cancelBtn.addEventListener('click', close);
  okBtn.addEventListener('click', submit);
  overlay.addEventListener('mousedown', function(e){ if(e.target===overlay) close(); });
  document.addEventListener('keydown', onKey, true);
  var firstEditable=fields.find(function(f){ return !f.readonly; }) || fields[0];
  var target=inputs[firstEditable.key];
  setTimeout(function(){ target.focus(); target.select(); }, 10);
}

/* ---------------- my saved graphs (localStorage) ---------------- */
var SAVED_KEY='graphite.saved.v1';
function loadSavedGraphs(){
  try{
    var raw=localStorage.getItem(SAVED_KEY);
    var data=raw?JSON.parse(raw):null;
    if(!data || typeof data!=='object') data={items:[], folders:[]};
    if(!Array.isArray(data.items)) data.items=[];
    if(!Array.isArray(data.folders)) data.folders=[];
    return data;
  }catch(e){ return {items:[], folders:[]}; }
}
function persistSavedGraphs(data){
  try{ localStorage.setItem(SAVED_KEY, JSON.stringify(data)); }catch(e){ showToast('Could not save (storage full or unavailable)'); }
}
function renderSavedGraphsList(){
  var data=loadSavedGraphs();
  var listEl=document.getElementById('savedGraphsList');
  listEl.innerHTML='';
  if(data.items.length===0){
    listEl.innerHTML='<div class="saved-empty">No saved graphs yet. Save your current graph to come back to it later.</div>';
    return;
  }
  var groups={'':[]};
  data.folders.forEach(function(f){ groups[f]=[]; });
  data.items.forEach(function(it){
    var f=it.folder&&groups.hasOwnProperty(it.folder)?it.folder:'';
    groups[f].push(it);
  });
  function renderGroup(name, items){
    if(items.length===0 && name!=='') return;
    if(name!==''){
      var head=document.createElement('div');
      head.className='saved-folder-head';
      head.textContent=name;
      var delFolder=document.createElement('button');
      delFolder.textContent='Remove folder';
      delFolder.style.marginLeft='auto';
      delFolder.style.fontSize='11px';
      delFolder.addEventListener('click', function(){
        var d=loadSavedGraphs();
        d.folders=d.folders.filter(function(x){ return x!==name; });
        d.items.forEach(function(it){ if(it.folder===name) it.folder=null; });
        persistSavedGraphs(d); renderSavedGraphsList();
      });
      head.appendChild(delFolder);
      listEl.appendChild(head);
    }
    items.forEach(function(it){ listEl.appendChild(renderSavedItem(it)); });
  }
  Object.keys(groups).forEach(function(k){ if(k!=='') renderGroup(k, groups[k]); });
  renderGroup('', groups['']);
}
function renderSavedItem(it){
  var row=document.createElement('div');
  row.className='saved-item';
  var name=document.createElement('div');
  name.className='saved-item-name';
  name.textContent=it.name;
  name.title='Load "'+it.name+'"';
  name.addEventListener('click', function(){
    if(applyGraphStateObj(it.state)){
      recompute(); renderList(); scheduleRender(); saveStateSoon(); pushHistory();
      closeModal();
      showToast('Loaded "'+it.name+'"');
    }
  });
  row.appendChild(name);
  var date=document.createElement('span');
  date.className='saved-item-date';
  try{ date.textContent=new Date(it.savedAt).toLocaleDateString(); }catch(e){}
  row.appendChild(date);
  var renameBtn=document.createElement('button');
  renameBtn.title='Rename';
  renameBtn.innerHTML='<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M11 2.5 13.5 5 5 13.5 2 14l.5-3Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  renameBtn.addEventListener('click', function(){
    askInline('Rename saved graph', [
      {key:'name', label:'Name', value:it.name, placeholder:'My graph'}
    ], function(values){
      var n=values.name;
      if(n && n.trim()){
        var d=loadSavedGraphs();
        var found=d.items.find(function(x){ return x.id===it.id; });
        if(found){ found.name=n.trim(); persistSavedGraphs(d); renderSavedGraphsList(); }
      }
    }, {submitLabel:'Rename'});
  });
  row.appendChild(renameBtn);
  var delBtn=document.createElement('button');
  delBtn.title='Delete';
  delBtn.innerHTML='<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 3.5h9M5.3 3.5V2.2h3.4v1.3M3.6 3.5l.5 8.3h5.8l.5-8.3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  delBtn.addEventListener('click', function(){
    var d=loadSavedGraphs();
    d.items=d.items.filter(function(x){ return x.id!==it.id; });
    persistSavedGraphs(d); renderSavedGraphsList();
  });
  row.appendChild(delBtn);
  return row;
}

var modeGraphingBtn=document.getElementById('modeGraphingBtn');
var modeGeometryBtn=document.getElementById('modeGeometryBtn');
var modeCalcBtn=document.getElementById('modeCalcBtn');
var modeSheetBtn=document.getElementById('modeSheetBtn');
var modeTableBtn=document.getElementById('modeTableBtn');
var graphWrapGraphing=document.getElementById('graphWrapGraphing');
var graphWrapGeometry=document.getElementById('graphWrapGeometry');
var calcWrap=document.getElementById('calcWrap');
var sheetWrap=document.getElementById('sheetWrap');
var tableWrap=document.getElementById('tableWrap');

var MODE_DEFS={
  graphing:  { sidebar:sidebarGraphing, wrap:graphWrapGraphing, btn:modeGraphingBtn, wrapDisplay:'block' },
  geometry:  { sidebar:sidebarGeometry, wrap:graphWrapGeometry, btn:modeGeometryBtn, wrapDisplay:'block' },
  calculator:{ sidebar:null,            wrap:calcWrap,          btn:modeCalcBtn,     wrapDisplay:'flex'  },
  spreadsheet:{sidebar:null,            wrap:sheetWrap,         btn:modeSheetBtn,    wrapDisplay:'flex'  },
  table:     { sidebar:sidebarTable,    wrap:tableWrap,         btn:modeTableBtn,    wrapDisplay:'block' }
};

function setMode(mode){
  if(!MODE_DEFS[mode]) return;
  currentMode=mode;
  window.__currentAppMode=mode;
  Object.keys(MODE_DEFS).forEach(function(key){
    var def=MODE_DEFS[key];
    var active=(key===mode);
    if(def.sidebar) def.sidebar.style.display = active?'flex':'none';
    def.wrap.style.display = active ? def.wrapDisplay : 'none';
    def.btn.className = active?'active':'';
  });
  ALL_SIDEBARS.forEach(function(sb){ sb.classList.remove('open'); });
  backdrop.classList.remove('open');
  if(mode==='geometry' && window.geoResizeCanvas){ window.geoResizeCanvas(); window.geoRender(); }
  else if(mode==='graphing'){ resizeCanvas(); scheduleRender(); }
  else if(mode==='spreadsheet' && window.sheetOnShow){ window.sheetOnShow(); }
  else if(mode==='table' && window.tableOnShow){ window.tableOnShow(); }
  else if(mode==='calculator' && window.calcOnShow){ window.calcOnShow(); }
  updateExportBtnVisibility();
}
modeGraphingBtn.addEventListener('click', function(){ setMode('graphing'); });
modeGeometryBtn.addEventListener('click', function(){ setMode('geometry'); });
modeCalcBtn.addEventListener('click', function(){ setMode('calculator'); });
modeSheetBtn.addEventListener('click', function(){ setMode('spreadsheet'); });
modeTableBtn.addEventListener('click', function(){ setMode('table'); });

<script>
(function(){
"use strict";

/* ============================================================= */
/* ======================= GEOMETRY MODE ========================== */
/* ============================================================= */

var UPPER='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
var LOWER='abcdefghijklmnopqrstuvwxyz'.split('');
var GREEK=['α','β','γ','δ','ε','ζ','η','θ','ι','κ'];

var geoObjects=[];
var geoIdCounter=1;
function gid(){ return 'g'+(geoIdCounter++); }

function usedLabels(){ var s=new Set(); geoObjects.forEach(function(o){ s.add(o.label); }); return s; }
function nextLabel(pool){
  var used=usedLabels();
  for(var i=0;i<pool.length;i++) if(!used.has(pool[i])) return pool[i];
  var n=2;
  while(true){ for(var i=0;i<pool.length;i++){ var cand=pool[i]+n; if(!used.has(cand)) return cand; } n++; }
}
function byId(id){ return geoObjects.find(function(o){ return o.id===id; }); }
function byLabel(lbl){ return geoObjects.find(function(o){ return o.label===lbl; }); }
function isPointType(o){ return o && o.type==='point'; }
function isLineType(o){ return o && (o.type==='segment'||o.type==='line'||o.type==='ray'); }
function getPt(id){ var o=byId(id); return o?{x:o.x,y:o.y}:null; }

var PALETTE_G=['#2d70b3','#c74440','#388c46','#6042a6','#e07d10','#0d9488','#cc3576','#8a6d3b'];
var paletteCursorG=0;
function nextColorG(){ var c=PALETTE_G[paletteCursorG%PALETTE_G.length]; paletteCursorG++; return c; }

function addFreePoint(x,y){
  var o={id:gid(), label:nextLabel(UPPER), type:'point', free:true, x:x, y:y, color:'#3c3c3c', visible:true};
  geoObjects.push(o);
  return o;
}
function addDerivedPoint(sub, deps, computeFn){
  var o={id:gid(), label:nextLabel(UPPER), type:'point', free:false, sub:sub, deps:deps, x:0, y:0, color:'#3c3c3c', visible:true, computeFn:computeFn};
  geoObjects.push(o);
  recomputeOne(o);
  return o;
}
function addShape(type, deps, extra){
  var pool = type==='polygon' ? null : LOWER;
  var label = type==='polygon' ? ('poly'+(geoObjects.filter(function(o){return o.type==='polygon';}).length+1))
            : type==='angle' ? nextLabel(GREEK)
            : nextLabel(LOWER);
  var o=Object.assign({id:gid(), label:label, type:type, deps:deps, color:nextColorG(), visible:true}, extra||{});
  geoObjects.push(o);
  recomputeOne(o);
  return o;
}

function recomputeOne(o){
  if(o.type==='point' && !o.free){
    if(o.sub==='reflect'){
      var rp=getPt(o.deps[0]); var rLine=byId(o.deps[1]);
      if(!rp||!rLine) return;
      if(!rLine.p1) recomputeOne(rLine);
      if(!rLine.p1) return;
      var rr=o.computeFn(rp, rLine);
      o.x=rr.x; o.y=rr.y;
    } else if(o.sub==='reflectCircle'){
      var rcp=getPt(o.deps[0]); var rCircle=byId(o.deps[1]);
      if(!rcp||!rCircle) return;
      if(!rCircle.center) recomputeOne(rCircle);
      if(!rCircle.center||!(rCircle.radius>=0)) return;
      var rc=computeReflectCircle(rcp, rCircle.center, rCircle.radius);
      o.x=rc.x; o.y=rc.y;
    } else if(o.sub==='onObject'){
      var target=byId(o.deps[0]);
      if(!target) return;
      recomputeOne(target);
      var pt=pointOnObjectAt(target, o.t);
      if(!pt) return;
      o.x=pt.x; o.y=pt.y;
    } else if(o.sub==='fixedLen'){
      var fc=getPt(o.deps[0]);
      if(!fc) return;
      o.x=fc.x+o.value*Math.cos(o.angle); o.y=fc.y+o.value*Math.sin(o.angle);
    } else if(o.sub==='intersect'){
      var iA=byId(o.deps[0]), iB=byId(o.deps[1]);
      if(!iA||!iB) return;
      recomputeOne(iA); recomputeOne(iB);
      var ipts=computeIntersection(iA,iB);
      if(!ipts[o.idx]) return;
      o.x=ipts[o.idx].x; o.y=ipts[o.idx].y;
    } else if(o.sub==='root'||o.sub==='extremum'){
      /* fixed at creation time from a numeric scan of a static typed function;
         nothing upstream to recompute from since functions aren't draggable. */
    } else {
      var pts=o.deps.map(getPt);
      if(pts.some(function(p){return !p;})) return;
      var r=o.computeFn.apply(null,pts.concat([o.value]));
      o.x=r.x; o.y=r.y;
    }
  } else if(o.type==='segment'||o.type==='ray'){
    if(o.sub==='median'||o.sub==='altitude'){
      var vertex=getPt(o.deps[0]); var sideLine=byId(o.deps[1]);
      if(!vertex||!sideLine) return;
      if(!sideLine.p1) recomputeOne(sideLine);
      if(!vertex||!sideLine||!sideLine.p1) return;
      var far = o.sub==='median' ? computeMidpoint(sideLine.p1,sideLine.p2) : computeFoot(vertex,sideLine.p1,sideLine.p2);
      o.p1=vertex; o.p2=far; o.length=Math.hypot(far.x-vertex.x,far.y-vertex.y);
    } else {
      var p1=getPt(o.deps[0]), p2=getPt(o.deps[1]);
      if(!p1||!p2) return;
      o.p1=p1; o.p2=p2; o.length=Math.hypot(p2.x-p1.x,p2.y-p1.y);
    }
  } else if(o.type==='line'){
    var p1b,p2b;
    if(o.sub==='perpendicular'||o.sub==='parallel'){
      var pt=getPt(o.deps[0]); var lineObj=byId(o.deps[1]);
      if(!pt||!lineObj||!lineObj.p1) { recomputeOne(lineObj); }
      if(!pt||!lineObj) return;
      var dx=lineObj.p2.x-lineObj.p1.x, dy=lineObj.p2.y-lineObj.p1.y;
      if(o.sub==='perpendicular'){ var t=dx; dx=-dy; dy=t; }
      p1b=pt; p2b={x:pt.x+dx,y:pt.y+dy};
    } else if(o.sub==='perpBisector'){
      var pA=getPt(o.deps[0]), pB=getPt(o.deps[1]);
      if(!pA||!pB) return;
      var midB=computeMidpoint(pA,pB);
      var bdx=pB.x-pA.x, bdy=pB.y-pA.y;
      p1b=midB; p2b={x:midB.x-bdy, y:midB.y+bdx};
    } else if(o.sub==='angleBisector'){
      var Ab=getPt(o.deps[0]), Bb=getPt(o.deps[1]), Cb=getPt(o.deps[2]);
      if(!Ab||!Bb||!Cb) return;
      var d1x=Ab.x-Bb.x, d1y=Ab.y-Bb.y, len1=Math.hypot(d1x,d1y)||1e-9;
      var d2x=Cb.x-Bb.x, d2y=Cb.y-Bb.y, len2=Math.hypot(d2x,d2y)||1e-9;
      var ux=d1x/len1+d2x/len2, uy=d1y/len1+d2y/len2;
      if(Math.hypot(ux,uy)<1e-9){ ux=-d1y/len1; uy=d1x/len1; }
      p1b=Bb; p2b={x:Bb.x+ux,y:Bb.y+uy};
    } else if(o.sub==='tangent'){
      var tpt=getPt(o.deps[0]); var tCircle=byId(o.deps[1]);
      if(!tpt||!tCircle) return;
      if(!tCircle.center) recomputeOne(tCircle);
      if(!tCircle.center||!(tCircle.radius>=0)) return;
      var tpts=computeTangentPoints(tpt, tCircle.center, tCircle.radius);
      if(!tpts[o.idx]) return;
      p1b=tpt; p2b=tpts[o.idx];
    } else if(o.sub==='bestFit'){
      var bfPts=o.deps.map(getPt);
      if(bfPts.some(function(p){return !p;}) || bfPts.length<2) return;
      var bf=computeBestFitLine(bfPts);
      p1b=bf.p1; p2b=bf.p2;
    } else {
      p1b=getPt(o.deps[0]); p2b=getPt(o.deps[1]);
    }
    if(!p1b||!p2b) return;
    o.p1=p1b; o.p2=p2b; o.length=Math.hypot(p2b.x-p1b.x,p2b.y-p1b.y);
  } else if(o.type==='vector'){
    if(o.sub==='fromPoint'){
      var vSrc=byId(o.deps[0]); var vAt=getPt(o.deps[1]);
      if(!vSrc||!vAt) return;
      if(vSrc.dx===undefined) recomputeOne(vSrc);
      if(vSrc.dx===undefined) return;
      o.p1=vAt; o.p2={x:vAt.x+vSrc.dx,y:vAt.y+vSrc.dy}; o.dx=vSrc.dx; o.dy=vSrc.dy; o.length=vSrc.length;
    } else {
      var p1c=getPt(o.deps[0]), p2c=getPt(o.deps[1]);
      if(!p1c||!p2c) return;
      o.p1=p1c; o.p2=p2c; o.dx=p2c.x-p1c.x; o.dy=p2c.y-p1c.y; o.length=Math.hypot(o.dx,o.dy);
    }
  } else if(o.type==='circle'){
    if(o.sub==='through3'){
      var cA=getPt(o.deps[0]), cB=getPt(o.deps[1]), cC=getPt(o.deps[2]);
      if(!cA||!cB||!cC) return;
      var cc=computeCircumcircle(cA,cB,cC);
      if(!cc) return;
      o.center=cc.center; o.radius=cc.radius;
    } else {
      var c=getPt(o.deps[0]);
      if(!c) return;
      o.center=c;
      if(o.deps[1]!==null && o.deps[1]!==undefined){ var rp=getPt(o.deps[1]); if(!rp) return; o.radius=Math.hypot(rp.x-c.x,rp.y-c.y); }
      else o.radius=o.fixedRadius;
    }
  } else if(o.type==='polygon'){
    var pts2;
    if(o.sub==='regular'){
      var rA=getPt(o.deps[0]), rB=getPt(o.deps[1]);
      if(!rA||!rB) return;
      var n=Math.max(3,Math.round(o.value)||3);
      pts2=[rA];
      var ddx=rB.x-rA.x, ddy=rB.y-rA.y;
      var cur=rA;
      var ext=2*Math.PI/n;
      for(var k=1;k<n;k++){
        var nxt={x:cur.x+ddx,y:cur.y+ddy};
        pts2.push(nxt);
        cur=nxt;
        var ca=Math.cos(ext), sa=Math.sin(ext);
        var ndx=ddx*ca-ddy*sa, ndy=ddx*sa+ddy*ca;
        ddx=ndx; ddy=ndy;
      }
    } else if(o.sub==='rigid'){
      var ctr=getPt(o.centerId);
      if(!ctr) return;
      pts2=o.offsets.map(function(off){ return {x:ctr.x+off.x, y:ctr.y+off.y}; });
    } else if(o.sub==='vectorChain'){
      var vcStart=getPt(o.deps[0]);
      if(!vcStart) return;
      var vcCur=vcStart, vcPts=[vcCur];
      for(var vci=1; vci<o.deps.length; vci++){
        var vcObj=byId(o.deps[vci]);
        if(!vcObj) return;
        recomputeOne(vcObj);
        if(vcObj.dx===undefined) return;
        vcCur={x:vcCur.x+vcObj.dx, y:vcCur.y+vcObj.dy};
        vcPts.push(vcCur);
      }
      pts2=vcPts;
    } else {
      pts2=o.deps.map(getPt);
      if(pts2.some(function(p){return !p;})) return;
    }
    o.pts=pts2;
    var area=0, perim=0;
    for(var i=0;i<pts2.length;i++){
      var a=pts2[i], b=pts2[(i+1)%pts2.length];
      area += a.x*b.y - b.x*a.y;
      perim += Math.hypot(b.x-a.x,b.y-a.y);
    }
    o.area=Math.abs(area)/2; o.perimeter=perim;
  } else if(o.type==='angle'){
    var A=getPt(o.deps[0]), B=getPt(o.deps[1]), C=getPt(o.deps[2]);
    if(!A||!B||!C) return;
    o.vertex=B; o.p1=A; o.p2=C;
    var a1=Math.atan2(A.y-B.y,A.x-B.x), a2=Math.atan2(C.y-B.y,C.x-B.x);
    var diff=Math.abs(a1-a2)*180/Math.PI;
    if(diff>180) diff=360-diff;
    o.degrees=diff;
  } else if(o.type==='polyline'){
    var plPts=o.deps.map(getPt);
    if(plPts.some(function(p){return !p;})) return;
    o.pts=plPts;
    var plen=0;
    for(var pi=0;pi<plPts.length-1;pi++) plen+=Math.hypot(plPts[pi+1].x-plPts[pi].x,plPts[pi+1].y-plPts[pi].y);
    o.length=plen;
  } else if(o.type==='arc'){
    if(o.sub==='semicircle'){
      var sA=getPt(o.deps[0]), sB=getPt(o.deps[1]);
      if(!sA||!sB) return;
      var ctr=computeMidpoint(sA,sB);
      var rad=Math.hypot(sB.x-sA.x,sB.y-sA.y)/2;
      o.center=ctr; o.radius=rad;
      o.startAngle=Math.atan2(sA.y-ctr.y,sA.x-ctr.x);
      o.endAngle=o.startAngle+Math.PI;
      o.length=Math.PI*rad;
    } else if(o.sub==='arc'||o.sub==='sector'){
      var acC=getPt(o.deps[0]), acS=getPt(o.deps[1]), acE=getPt(o.deps[2]);
      if(!acC||!acS||!acE) return;
      var acR=Math.hypot(acS.x-acC.x,acS.y-acC.y);
      o.center=acC; o.radius=acR;
      o.startAngle=Math.atan2(acS.y-acC.y,acS.x-acC.x);
      var rawEnd=Math.atan2(acE.y-acC.y,acE.x-acC.x);
      var span=angNorm(rawEnd-o.startAngle);
      o.endAngle=o.startAngle+span;
      o.length = o.sub==='sector' ? acR*span+2*acR : acR*span;
    } else if(o.sub==='circumArc'||o.sub==='circumSector'){
      var cA2=getPt(o.deps[0]), cB2=getPt(o.deps[1]), cC2=getPt(o.deps[2]);
      if(!cA2||!cB2||!cC2) return;
      var circ=computeCircumcircle(cA2,cB2,cC2);
      if(!circ) return;
      o.center=circ.center; o.radius=circ.radius;
      var a0=Math.atan2(cA2.y-circ.center.y,cA2.x-circ.center.x);
      var aB=angNorm(Math.atan2(cB2.y-circ.center.y,cB2.x-circ.center.x)-a0);
      var aC=angNorm(Math.atan2(cC2.y-circ.center.y,cC2.x-circ.center.x)-a0);
      var span2 = (aB<=aC) ? aC : aC-2*Math.PI;
      o.startAngle=a0; o.endAngle=a0+span2;
      o.length = o.sub==='circumSector' ? circ.radius*Math.abs(span2)+2*circ.radius : circ.radius*Math.abs(span2);
    }
  } else if(o.type==='conic'){
    if(o.sub==='ellipse'||o.sub==='hyperbola'){
      var F1=getPt(o.deps[0]), F2=getPt(o.deps[1]), Pp=getPt(o.deps[2]);
      if(!F1||!F2||!Pp) return;
      var cx0=(F1.x+F2.x)/2, cy0=(F1.y+F2.y)/2;
      var cdist=Math.hypot(F2.x-F1.x,F2.y-F1.y)/2;
      var d1=Math.hypot(Pp.x-F1.x,Pp.y-F1.y), d2=Math.hypot(Pp.x-F2.x,Pp.y-F2.y);
      var aa = o.sub==='ellipse' ? (d1+d2)/2 : Math.abs(d1-d2)/2;
      var bb2 = o.sub==='ellipse' ? aa*aa-cdist*cdist : cdist*cdist-aa*aa;
      if(bb2<0) bb2=0;
      o.center={x:cx0,y:cy0}; o.a=aa; o.b=Math.sqrt(bb2); o.angle=Math.atan2(F2.y-F1.y,F2.x-F1.x);
    } else if(o.sub==='parabola'){
      var foc=getPt(o.deps[0]); var dirLine=byId(o.deps[1]);
      if(!foc||!dirLine) return;
      if(!dirLine.p1) recomputeOne(dirLine);
      if(!dirLine.p1) return;
      var foot2=computeFoot(foc,dirLine.p1,dirLine.p2);
      var vert={x:(foc.x+foot2.x)/2,y:(foc.y+foot2.y)/2};
      var pDist=Math.hypot(foc.x-vert.x,foc.y-vert.y)||1e-9;
      var axx=foc.x-vert.x, axy=foc.y-vert.y;
      var axLen=Math.hypot(axx,axy)||1e-9;
      axx/=axLen; axy/=axLen;
      o.vertex=vert; o.p=pDist; o.axisX=axx; o.axisY=axy; o.perpX=-axy; o.perpY=axx;
    }
  } else if(o.type==='measure'){
    if(o.sub==='distance'){
      var mA=getPt(o.deps[0]), mB=getPt(o.deps[1]);
      if(!mA||!mB) return;
      o.value=Math.hypot(mB.x-mA.x,mB.y-mA.y);
      o.anchor=computeMidpoint(mA,mB);
    } else if(o.sub==='slope'){
      var mLine=byId(o.deps[0]);
      if(!mLine) return;
      if(!mLine.p1) recomputeOne(mLine);
      if(!mLine.p1) return;
      var sdx=mLine.p2.x-mLine.p1.x, sdy=mLine.p2.y-mLine.p1.y;
      o.value = Math.abs(sdx)<1e-9 ? Infinity : sdy/sdx;
      o.anchor=computeMidpoint(mLine.p1,mLine.p2);
      o.runStart=mLine.p1;
    }
  } else if(o.type==='locus'){
    var locTarget=byId(o.deps[0]), locDriver=byId(o.deps[1]);
    if(!locTarget||!locDriver||locDriver.sub!=='onObject'){ o.pts=null; return; }
    var savedT=locDriver.t;
    var N=60, samplePts=[];
    for(var lsi=0; lsi<=N; lsi++){
      locDriver.t=lsi/N;
      for(var lk=0; lk<geoObjects.length; lk++){ var loo=geoObjects[lk]; if(loo.type!=='locus') recomputeOne(loo); }
      if(isFinite(locTarget.x) && isFinite(locTarget.y)) samplePts.push({x:locTarget.x,y:locTarget.y});
    }
    locDriver.t=savedT;
    for(var lk2=0; lk2<geoObjects.length; lk2++){ var loo2=geoObjects[lk2]; if(loo2.type!=='locus') recomputeOne(loo2); }
    o.pts=samplePts;
  }
}
function recomputeAllGeo(){ geoObjects.forEach(recomputeOne); }
function computeBestFitLine(pts){
  var n=pts.length;
  var mx=pts.reduce(function(s,p){return s+p.x;},0)/n;
  var my=pts.reduce(function(s,p){return s+p.y;},0)/n;
  var sxy=0, sxx=0;
  pts.forEach(function(p){ sxy+=(p.x-mx)*(p.y-my); sxx+=(p.x-mx)*(p.x-mx); });
  if(Math.abs(sxx)<1e-9){
    return {p1:{x:mx,y:my-10}, p2:{x:mx,y:my+10}};
  }
  var slope=sxy/sxx, intercept=my-slope*mx;
  return {p1:{x:mx-10,y:slope*(mx-10)+intercept}, p2:{x:mx+10,y:slope*(mx+10)+intercept}};
}
function makeFunctionFromExpr(exprText){
  var eng=window.MathEngine;
  var ast=eng.parseExpression(exprText);
  var compiled=eng.compile(ast,{});
  return function(x){
    try{ var v=compiled({x:x}); return (typeof v==='number')?v:NaN; }catch(e){ return NaN; }
  };
}
function signCrossed(a,b){ return (a<=0&&b>0) || (a>=0&&b<0); }
function findFunctionRoots(fn, xMin, xMax){
  var N=800, roots=[], prevX=xMin, prevY=fn(prevX);
  for(var i=1;i<=N;i++){

function computeCircleCircleIntersect(c1,c2){

function computeTangentPoints(P,C,r){

/* ---------------- canvas + view ---------------- */
var gcanvas=document.getElementById('geoCanvas');

var gwrap=document.getElementById('graphWrapGeometry');
var gview={cx:0,cy:0,scale:50};
var gcssW=0,gcssH=0,gdpr=1;

function geoResizeCanvas(){
  var rect=gwrap.getBoundingClientRect();
  gcssW=rect.width; gcssH=rect.height;
  gdpr=window.devicePixelRatio||1;
  gcanvas.width=Math.round(gcssW*gdpr); gcanvas.height=Math.round(gcssH*gdpr);
  gcanvas.style.width=gcssW+'px'; gcanvas.style.height=gcssH+'px';
}

  var step=gNiceStep(70/gview.scale), minorStep=step/5;
  var left=gScreenToMath(0,0).x, right=gScreenToMath(gcssW,0).x;
  var top=gScreenToMath(0,0).y, bottom=gScreenToMath(0,gcssH).y;
  gctx.lineWidth=1; gctx.strokeStyle=th.gridMinor; gctx.beginPath();
  for(var x=Math.floor(left/minorStep)*minorStep; x<=right; x+=minorStep){ var sx=gMathToScreen(x,0).x; gctx.moveTo(sx+0.5,0); gctx.lineTo(sx+0.5,gcssH); }
  for(var y=Math.floor(bottom/minorStep)*minorStep; y<=top; y+=minorStep){ var sy=gMathToScreen(0,y).y; gctx.moveTo(0,sy+0.5); gctx.lineTo(gcssW,sy+0.5); }
  gctx.stroke();
  gctx.strokeStyle=th.gridMajor; gctx.beginPath();
  for(var x2=Math.floor(left/step)*step; x2<=right; x2+=step){ var sx2=gMathToScreen(x2,0).x; gctx.moveTo(sx2+0.5,0); gctx.lineTo(sx2+0.5,gcssH); }
  for(var y2=Math.floor(bottom/step)*step; y2<=top; y2+=step){ var sy2=gMathToScreen(0,y2).y; gctx.moveTo(0,sy2+0.5); gctx.lineTo(gcssW,sy2+0.5); }
  gctx.stroke();
  gctx.strokeStyle=th.axis; gctx.lineWidth=1.6;
  var o=gMathToScreen(0,0);
  gctx.beginPath(); gctx.moveTo(0,Math.round(o.y)+0.5); gctx.lineTo(gcssW,Math.round(o.y)+0.5);
  gctx.moveTo(Math.round(o.x)+0.5,0); gctx.lineTo(Math.round(o.x)+0.5,gcssH); gctx.stroke();
}

function extendLine(p1,p2,onlyForward){
  var dx=p2.x-p1.x, dy=p2.y-p1.y;

  dx/=len; dy/=len;

  var a = onlyForward ? p1 : {x:p1.x-dx*far,y:p1.y-dy*far};
  var b = {x:p2.x+dx*far,y:p2.y+dy*far};

function geoRender(){
  if(gcssW===0) geoResizeCanvas();
  gctx.save();

  geoDrawGrid();
  var th=gReadTheme();

  geoObjects.forEach(function(o){
    if(!o.visible) return;
    if(o.type==='segment'||o.type==='line'||o.type==='ray'){
      if(!o.p1) return;
      var s1=gMathToScreen(o.p1.x,o.p1.y), s2=gMathToScreen(o.p2.x,o.p2.y);
      if(o.type!=='segment'){

      gctx.strokeStyle=o.color; gctx.lineWidth=2.2; gctx.beginPath();
      gctx.moveTo(v1.x,v1.y); gctx.lineTo(v2.x,v2.y); gctx.stroke();
      var ang=Math.atan2(v2.y-v1.y,v2.x-v1.x);
      gctx.beginPath();
      gctx.moveTo(v2.x,v2.y);
      gctx.lineTo(v2.x-10*Math.cos(ang-0.4), v2.y-10*Math.sin(ang-0.4));
      gctx.lineTo(v2.x-10*Math.cos(ang+0.4), v2.y-10*Math.sin(ang+0.4));

    } else if(o.type==='circle'){
      if(!o.center||!(o.radius>=0)) return;
      var cs=gMathToScreen(o.center.x,o.center.y);
      gctx.strokeStyle=o.color; gctx.lineWidth=2;
      gctx.beginPath(); gctx.arc(cs.x,cs.y,o.radius*gview.scale,0,Math.PI*2); gctx.stroke();
    } else if(o.type==='polygon'){
      if(!o.pts) return;
      gctx.beginPath();
      o.pts.forEach(function(p,i){ var s=gMathToScreen(p.x,p.y); if(i===0) gctx.moveTo(s.x,s.y); else gctx.lineTo(s.x,s.y); });

      gctx.strokeStyle=o.color; gctx.lineWidth=2; gctx.stroke();
    } else if(o.type==='angle'){
      if(!o.vertex) return;
      var vs=gMathToScreen(o.vertex.x,o.vertex.y);
      var a1=Math.atan2(o.p1.y-o.vertex.y,o.p1.x-o.vertex.x);
      var a2=Math.atan2(o.p2.y-o.vertex.y,o.p2.x-o.vertex.x);
      gctx.strokeStyle=o.color; gctx.lineWidth=2;
      gctx.beginPath(); gctx.arc(vs.x,vs.y,22,-a1,-a2,false); gctx.stroke();
    } else if(o.type==='polyline'){
      if(!o.pts) return;
      gctx.beginPath();
      o.pts.forEach(function(p,i){ var s=gMathToScreen(p.x,p.y); if(i===0) gctx.moveTo(s.x,s.y); else gctx.lineTo(s.x,s.y); });

          var ey=o.center.y+o.a*Math.cos(tt)*Math.sin(o.angle)+o.b*Math.sin(tt)*Math.cos(o.angle);

        var rs=gMathToScreen(o.runStart.x,o.runStart.y);
        var re=gMathToScreen(o.runStart.x+1, o.runStart.y+o.value);

  });

    gctx.fillStyle= o===dragGeoPoint ? '#1c76d3' : th.axis; gctx.fill();

    gctx.strokeStyle='#1c76d3'; gctx.lineWidth=2; gctx.stroke();
  });
  gctx.restore();
}

var geoListEl=document.getElementById('geoList');
function geoFormatNum(v){ if(!isFinite(v)) return '—'; var s=Math.round(v*100)/100; return String(s); }

  geoListEl.innerHTML='';
  geoObjects.forEach(function(o){
    var row=document.createElement('div');
    row.className='expr-row';
    var sw=document.createElement('span'); sw.className='swatch-btn'; sw.style.setProperty('--dot-color', o.type==='point'?'#3c3c3c':o.color); sw.style.pointerEvents='none';
    row.appendChild(sw);
    var main=document.createElement('div'); main.className='expr-main';
    var line1=document.createElement('div'); line1.className='expr-input-wrap';
    var label=document.createElement('span'); label.className='expr-input mono'; label.style.padding='6px 2px';
    label.textContent = describeGeoObject(o);
    line1.appendChild(label);
    var actions=document.createElement('div'); actions.className='expr-row-actions';
    var eyeBtn=document.createElement('button'); eyeBtn.className='row-btn'+(o.visible?'':' hidden-state');
    eyeBtn.innerHTML='◉'; eyeBtn.title=o.visible?'Hide':'Show';
    eyeBtn.addEventListener('click', function(){ o.visible=!o.visible; renderGeoList(); geoRender(); });
    actions.appendChild(eyeBtn);
    var delBtn=document.createElement('button'); delBtn.className='row-btn'; delBtn.innerHTML='×'; delBtn.title='Delete';
    delBtn.addEventListener('click', function(){ deleteGeoObject(o.id); });
    actions.appendChild(delBtn);
    line1.appendChild(actions);
    main.appendChild(line1);
    row.appendChild(main);
    geoListEl.appendChild(row);
  });
}
function deleteGeoObject(id){
  var dependents = geoObjects.filter(function(o){ return o.deps && o.deps.indexOf(id)!==-1; });
  dependents.forEach(function(d){ deleteGeoObject(d.id); });
  geoObjects = geoObjects.filter(function(o){ return o.id!==id; });
  renderGeoList(); geoRender();
}
function describeGeoObject(o){
  if(o.type==='point'){
    if(o.sub==='complex') return o.label+' = '+geoFormatNum(o.x)+(o.y>=0?' + ':' - ')+geoFormatNum(Math.abs(o.y))+'i';
    var ptSuf = o.sub==='root' ? ' (root)' : o.sub==='extremum' ? ' (extremum)' : '';
    return o.label+' = ('+geoFormatNum(o.x)+', '+geoFormatNum(o.y)+')'+ptSuf;
  }
  if(o.type==='segment'){
    if(o.sub==='median') return o.label+' = Median, length '+geoFormatNum(o.length);
    if(o.sub==='altitude') return o.label+' = Altitude, length '+geoFormatNum(o.length);
    return o.label+' = Segment, length '+geoFormatNum(o.length);
  }
  if(o.type==='line'){
    if(o.sub==='perpBisector') return o.label+': perpendicular bisector';
    if(o.sub==='angleBisector') return o.label+': angle bisector';
    if(o.sub==='bestFit') return o.label+': Best Fit Line';
    return o.label+': line';
  }
  if(o.type==='ray') return o.label+': ray';
  if(o.type==='vector') return o.label+' = Vector, length '+geoFormatNum(o.length);
  if(o.type==='circle'){
    if(o.sub==='through3') return o.label+': Circle (through 3 pts), r = '+geoFormatNum(o.radius);
    return o.label+': Circle, r = '+geoFormatNum(o.radius);
  }
  if(o.type==='polygon'){
    var polySuf = o.sub==='regular' ? ' (regular)' : o.sub==='rigid' ? ' (rigid)' : o.sub==='vectorChain' ? ' (vector polygon)' : '';
    return o.label+' = Polygon'+polySuf+', area '+geoFormatNum(o.area);
  }
  if(o.type==='angle') return o.label+' = '+geoFormatNum(o.degrees)+'°';
  if(o.type==='polyline') return o.label+' = Polyline, length '+geoFormatNum(o.length);
  if(o.type==='arc'){
    var arcLabel = (o.sub==='sector'||o.sub==='circumSector') ? 'Sector' : (o.sub==='semicircle'?'Semicircle':'Arc');
    return o.label+' = '+arcLabel+', length '+geoFormatNum(o.length);
  }
  if(o.type==='conic'){
    var conicLabel = o.sub==='ellipse'?'Ellipse':o.sub==='hyperbola'?'Hyperbola':'Parabola';
    return o.label+': '+conicLabel;
  }
  if(o.type==='measure'){
    if(o.sub==='distance') return o.label+' = Distance = '+geoFormatNum(o.value);
    return o.label+' = Slope = '+(isFinite(o.value)?geoFormatNum(o.value):'undefined');
  }
  if(o.type==='function') return o.label+'(x) = '+o.exprText;
  if(o.type==='locus') return o.label+': Locus';
  return o.label;
}

var toolStatusEl=document.getElementById('toolStatus');
function setToolStatus(text){
  if(!text){ toolStatusEl.classList.remove('visible'); return; }
  toolStatusEl.textContent=text; toolStatusEl.classList.add('visible');
}
function updateToolStatus(){
  var spec=TOOLS.find(function(t){return t.id===currentTool;});
  if(!spec || currentTool==='move' || currentTool==='point'){ setToolStatus(currentTool==='point'?'Click to place a point':null); return; }
  if(spec.id==='complexPoint'){ setToolStatus('Click to place a complex number a+bi'); return; }
  if(spec.id==='polygon'||spec.id==='rigidPolygon'){ setToolStatus('Click points, then click the first point again to close ('+pendingClicks.length+' so far)'); return; }
  if(spec.id==='polyline'){ setToolStatus('Click points, then double-click to finish ('+pendingClicks.length+' so far)'); return; }
  if(spec.id==='bestFitLine'){ setToolStatus('Click points to fit, then double-click to finish ('+pendingClicks.length+' so far)'); return; }
  if(spec.id==='vectorPolygon'){ setToolStatus(pendingClicks.length===0 ? 'Click a start point, then click vectors to chain, then double-click to finish' : 'Click a vector to chain, then double-click to finish ('+(pendingClicks.length-1)+' so far)'); return; }
  if(spec.id==='attachDetach'){ setToolStatus(pendingClicks.length===0 ? 'Click an attached point to detach it, or a free point then a curve to attach' : 'Now click the curve to attach to'); return; }
  var need = spec.needsValue ? spec.arity : spec.arity;
  setToolStatus(spec.label+': click '+(pendingClicks.length+1)+' of '+spec.arity);
}

function toolButtons(){
  var row1=document.getElementById('geoToolbar1'), row2=document.getElementById('geoToolbar2');
  row1.innerHTML=''; row2.innerHTML='';
  var mid=Math.ceil(Math.ceil(TOOLS.length/2)/4)*4;
  TOOLS.forEach(function(t,i){
    var b=document.createElement('button');
    b.textContent=t.label;
    b.dataset.tool=t.id;
    b.addEventListener('click', function(){ selectTool(t.id); });
    (i<mid?row1:row2).appendChild(b);
  });
}
function selectTool(id){
  if(id==='functionTool'){
    askText('Define a function, e.g. f(x)=x^2-2', 'x^2', function(text){
      if(text && text.trim()){
        try{ createFunctionObject(text.trim()); renderGeoList(); geoRender(); }
        catch(e){ setToolStatus('Error: '+(e.message||e)); setTimeout(updateToolStatus,2200); }
      }
    });
    id='move';
  }
  currentTool=id; pendingClicks=[];
  Array.from(document.querySelectorAll('#geoToolbar1 button,#geoToolbar2 button')).forEach(function(b){
    b.style.background = b.dataset.tool===id ? 'var(--accent-soft)' : '';
    b.style.color = b.dataset.tool===id ? 'var(--accent)' : '';
  });
  updateToolStatus();
  geoRender();
}
function createFunctionObject(exprText){
  var fn=makeFunctionFromExpr(exprText);
  var o={id:gid(), label:nextLabel(LOWER), type:'function', deps:[], exprText:exprText, fn:fn, color:nextColorG(), visible:true};
  geoObjects.push(o);
  return o;
}

/* numeric value prompt (for rotate angle / dilate factor) */
function askNumber(label, dflt, cb){
  var pop=document.createElement('div');
  pop.className='color-pop'; pop.style.gridTemplateColumns='auto'; pop.style.display='block'; pop.style.padding='10px';
  pop.innerHTML='<div style="font-size:12px;margin-bottom:6px;">'+label+'</div><input type="text" value="'+dflt+'" style="width:90px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-family:inherit;">';
  pop.style.position='fixed'; pop.style.left='50%'; pop.style.top='50%'; pop.style.transform='translate(-50%,-50%)'; pop.style.zIndex=100;
  document.body.appendChild(pop);
  var input=pop.querySelector('input');
  input.focus(); input.select();
  var done=false;
  function finish(){
    if(done) return;
    done=true;
    var v=parseFloat(input.value);
    pop.remove();
    cb(isNaN(v)?dflt:v);
  }
  input.addEventListener('keydown', function(ev){
    if(ev.key==='Enter') finish();
    if(ev.key==='Escape'){ if(!done){ done=true; pop.remove(); pendingClicks=[]; updateToolStatus(); } }
  });
  input.addEventListener('blur', finish);
}
/* text prompt (for typed function definitions) */
function askText(label, dflt, cb){
  var pop=document.createElement('div');
  pop.className='color-pop'; pop.style.gridTemplateColumns='auto'; pop.style.display='block'; pop.style.padding='10px';
  pop.innerHTML='<div style="font-size:12px;margin-bottom:6px;">'+label+'</div><input type="text" value="'+dflt+'" class="mono" style="width:180px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-family:inherit;">';
  pop.style.position='fixed'; pop.style.left='50%'; pop.style.top='50%'; pop.style.transform='translate(-50%,-50%)'; pop.style.zIndex=100;
  document.body.appendChild(pop);
  var input=pop.querySelector('input');
  input.focus(); input.select();
  var done=false;
  function finish(){
    if(done) return;
    done=true;
    var v=input.value;
    pop.remove();
    cb(v);
  }
  var cancelled=false;
  input.addEventListener('keydown', function(ev){
    if(ev.key==='Enter') finish();
    if(ev.key==='Escape'){ if(!done){ done=true; cancelled=true; pop.remove(); } }
  });
  input.addEventListener('blur', function(){ if(!cancelled) finish(); });
}

function findPointNear(px,py,radius){
  var best=null,bestD=radius||14;
  geoObjects.forEach(function(o){
    if(o.type!=='point'||!o.visible) return;
    var s=gMathToScreen(o.x,o.y);
    var d=Math.hypot(s.x-px,s.y-py);
    if(d<bestD){ bestD=d; best=o; }
  });
  return best;
}
function findLineNear(px,py,radius){
  var best=null,bestD=radius||10;
  geoObjects.forEach(function(o){
    if(!isLineType(o)||!o.visible||!o.p1) return;
    var a=gMathToScreen(o.p1.x,o.p1.y), b=gMathToScreen(o.p2.x,o.p2.y);
    var d=distToSegment(px,py,a.x,a.y,b.x,b.y);
    if(d<bestD){ bestD=d; best=o; }
  });
  return best;
}
function findCircleNear(px,py,radius){
  var best=null,bestD=radius||10;
  geoObjects.forEach(function(o){
    if(o.type!=='circle'||!o.visible||!o.center) return;
    var cs=gMathToScreen(o.center.x,o.center.y);
    var d=Math.abs(Math.hypot(cs.x-px,cs.y-py)-o.radius*gview.scale);
    if(d<bestD){ bestD=d; best=o; }
  });
  return best;
}
function findVectorNear(px,py,radius){
  var best=null,bestD=radius||10;
  geoObjects.forEach(function(o){
    if(o.type!=='vector'||!o.visible||!o.p1) return;
    var a=gMathToScreen(o.p1.x,o.p1.y), b=gMathToScreen(o.p2.x,o.p2.y);
    var d=distToSegment(px,py,a.x,a.y,b.x,b.y);
    if(d<bestD){ bestD=d; best=o; }
  });
  return best;
}
function findCurveNear(px,py,radius){
  return findLineNear(px,py,radius) || findCircleNear(px,py,radius);
}
function findFunctionNear(px,py,radius){
  var best=null,bestD=radius||12;
  var m=gScreenToMath(px,py);
  geoObjects.forEach(function(o){
    if(o.type!=='function'||!o.visible||!o.fn) return;
    var y=o.fn(m.x);
    if(!isFinite(y)) return;
    var sy=gMathToScreen(m.x,y).y;
    var d=Math.abs(sy-py);
    if(d<bestD){ bestD=d; best=o; }
  });
  return best;
}
function distToSegment(px,py,ax,ay,bx,by){
  var dx=bx-ax,dy=by-ay;
  var len2=dx*dx+dy*dy||1e-9;
  var t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/len2));
  var cx=ax+t*dx, cy=ay+t*dy;
  return Math.hypot(px-cx,py-cy);
}

function resolvePointClick(px,py){
  var existing=findPointNear(px,py);
  if(existing) return existing;
  var m=gScreenToMath(px,py);
  return addFreePoint(m.x,m.y);
}

function finishTool(spec){
  var els=pendingClicks.map(function(c){ return c.obj; });
  function P(i){ return els[i].id; }
  if(spec.id==='segment') addShape('segment',[P(0),P(1)]);
  else if(spec.id==='line') addShape('line',[P(0),P(1)]);
  else if(spec.id==='ray') addShape('ray',[P(0),P(1)]);
  else if(spec.id==='circle') addShape('circle',[P(0),P(1)]);
  else if(spec.id==='vector') addShape('vector',[P(0),P(1)]);
  else if(spec.id==='midpoint') addDerivedPoint('midpoint',[P(0),P(1)], computeMidpoint);
  else if(spec.id==='angle') addShape('angle',[P(0),P(1),P(2)]);
  else if(spec.id==='perpendicular') addShape('line',[P(0),els[1].id],{sub:'perpendicular'});
  else if(spec.id==='parallel') addShape('line',[P(0),els[1].id],{sub:'parallel'});
  else if(spec.id==='perpBisector') addShape('line',[P(0),P(1)],{sub:'perpBisector'});
  else if(spec.id==='angleBisector') addShape('line',[P(0),P(1),P(2)],{sub:'angleBisector'});
  else if(spec.id==='median') addShape('segment',[P(0),els[1].id],{sub:'median'});
  else if(spec.id==='altitude') addShape('segment',[P(0),els[1].id],{sub:'altitude'});
  else if(spec.id==='reflect') addDerivedPoint('reflect',[P(0),els[1].id], function(p,lineObj){ return computeReflect(p,lineObj); });
  else if(spec.id==='translate') addDerivedPoint('translate',[P(0),P(1),P(2)], computeTranslate);
  else if(spec.id==='rotate'){
    askNumber(spec.needsValue.label, spec.needsValue.dflt, function(val){
      var o=addDerivedPoint('rotate',[P(0),P(1)], function(p,c,v){ return computeRotate(p,c,v); });
      o.value=val; recomputeOne(o); renderGeoList(); geoRender();
    });
  }
  else if(spec.id==='dilate'){
    askNumber(spec.needsValue.label, spec.needsValue.dflt, function(val){
      var o=addDerivedPoint('dilate',[P(0),P(1)], function(p,c,v){ return computeDilate(p,c,v); });
      o.value=val; recomputeOne(o); renderGeoList(); geoRender();
    });
  }
  else if(spec.id==='pointOn'){
    var targetId=els[0].id;
    var targetObj=byId(targetId);
    recomputeOne(targetObj);
    var t0=paramForPointOnObject(targetObj, pendingClicks[0].m);
    var op=addDerivedPoint('onObject',[targetId], function(){return {x:0,y:0};});
    op.t=t0; recomputeOne(op);
  }
  else if(spec.id==='intersect'){
    var iA=els[0].id, iB=els[1].id;
    var iaObj=byId(iA), ibObj=byId(iB);
    recomputeOne(iaObj); recomputeOne(ibObj);
    var ipts=computeIntersection(iaObj, ibObj);
    ipts.forEach(function(pt,idx){
      var ip=addDerivedPoint('intersect',[iA,iB], function(){return {x:0,y:0};});
      ip.idx=idx; recomputeOne(ip);
    });
  }
  else if(spec.id==='segmentFixed'){
    askNumber(spec.needsValue.label, spec.needsValue.dflt, function(val){
      var startId=P(0);
      var np=addDerivedPoint('fixedLen',[startId], function(){return {x:0,y:0};});
      np.value=val; np.angle=0; recomputeOne(np);
      addShape('segment',[startId, np.id]);
      renderGeoList(); geoRender();
    });
  }
  else if(spec.id==='vectorFromPoint') addShape('vector',[els[0].id, els[1].id],{sub:'fromPoint'});
  else if(spec.id==='tangent'){
    var tPtId=els[0].id, tCircId=els[1].id;
    var tCirc=byId(tCircId); recomputeOne(tCirc);
    var tPt=getPt(tPtId);
    var tpts=computeTangentPoints(tPt, tCirc.center, tCirc.radius);
    tpts.forEach(function(pt,idx){
      var tl=addShape('line',[tPtId, tCircId],{sub:'tangent'});
      tl.idx=idx; recomputeOne(tl);
    });
  }
  else if(spec.id==='regularPolygon'){
    askNumber(spec.needsValue.label, spec.needsValue.dflt, function(val){
      addShape('polygon',[P(0),P(1)],{sub:'regular', value:Math.max(3,Math.round(val))});
      renderGeoList(); geoRender();
    });
  }
  else if(spec.id==='circleRadius'){
    askNumber(spec.needsValue.label, spec.needsValue.dflt, function(val){
      addShape('circle',[P(0), null],{fixedRadius: val});
      renderGeoList(); geoRender();
    });
  }
  else if(spec.id==='circle3pt') addShape('circle',[P(0),P(1),P(2)],{sub:'through3'});
  else if(spec.id==='semicircle') addShape('arc',[P(0),P(1)],{sub:'semicircle'});
  else if(spec.id==='circleArc') addShape('arc',[P(0),P(1),P(2)],{sub:'arc'});
  else if(spec.id==='circumArc') addShape('arc',[P(0),P(1),P(2)],{sub:'circumArc'});
  else if(spec.id==='circleSector') addShape('arc',[P(0),P(1),P(2)],{sub:'sector'});
  else if(spec.id==='circumSector') addShape('arc',[P(0),P(1),P(2)],{sub:'circumSector'});
  else if(spec.id==='ellipse') addShape('conic',[P(0),P(1),P(2)],{sub:'ellipse'});
  else if(spec.id==='hyperbola') addShape('conic',[P(0),P(1),P(2)],{sub:'hyperbola'});
  else if(spec.id==='parabola') addShape('conic',[P(0),els[1].id],{sub:'parabola'});
  else if(spec.id==='angleFixed'){
    askNumber(spec.needsValue.label, spec.needsValue.dflt, function(val){
      var o=addDerivedPoint('rotate',[P(0),P(1)], function(p,c,v){ return computeRotate(p,c,v); });
      o.value=val; recomputeOne(o);
      addShape('angle',[P(0),P(1),o.id]);
      renderGeoList(); geoRender();
    });
  }
  else if(spec.id==='distanceTool') addShape('measure',[P(0),P(1)],{sub:'distance'});
  else if(spec.id==='slopeTool') addShape('measure',[els[0].id],{sub:'slope'});
  else if(spec.id==='reflectPoint') addDerivedPoint('reflectPoint',[P(0),P(1)], function(p,c){ return computeReflectPoint(p,c); });
  else if(spec.id==='reflectCircle') addDerivedPoint('reflectCircle',[P(0),els[1].id], function(){return {x:0,y:0};});
  else if(spec.id==='locus'){
    var locT=els[0], locD=els[1];
    if(locD.sub!=='onObject'){ setToolStatus('Second point must be a point on an object (use Pt. on Obj. first)'); setTimeout(updateToolStatus,2400); }
    else addShape('locus',[locT.id, locD.id]);
  }
  else if(spec.id==='rootsTool'){
    var rFn=els[0];
    var rLeft=gScreenToMath(0,0).x, rRight=gScreenToMath(gcssW,0).x;
    var rRoots=findFunctionRoots(rFn.fn, rLeft, rRight);
    rRoots.forEach(function(rx){
      geoObjects.push({id:gid(), label:nextLabel(UPPER), type:'point', free:false, sub:'root', deps:[rFn.id], x:rx, y:0, color:'#3c3c3c', visible:true});
    });
  }
  else if(spec.id==='extremumTool'){
    var eFn=els[0];
    var eLeft=gScreenToMath(0,0).x, eRight=gScreenToMath(gcssW,0).x;
    var eExtrema=findFunctionExtrema(eFn.fn, eLeft, eRight);
    eExtrema.forEach(function(ep){
      geoObjects.push({id:gid(), label:nextLabel(UPPER), type:'point', free:false, sub:'extremum', deps:[eFn.id], x:ep.x, y:ep.y, color:'#3c3c3c', visible:true});
    });
  }
  else if(spec.id==='attachDetach'){
    var adPt=els[0], adCurve=els[1];
    recomputeOne(adCurve);
    adPt.free=false; adPt.sub='onObject'; adPt.deps=[adCurve.id];
    adPt.t=paramForPointOnObject(adCurve, {x:adPt.x,y:adPt.y});
    recomputeOne(adPt);
  }
  pendingClicks=[];
  renderGeoList(); geoRender(); updateToolStatus();
}

var dragGeoPoint=null;
var gDragging=false, gDragLast=null, gDragMoved=false;

gcanvas.addEventListener('pointerdown', function(ev){
  var rect=gcanvas.getBoundingClientRect();
  var px=ev.clientX-rect.left, py=ev.clientY-rect.top;
  if(currentTool==='move'){
    var pt=findPointNear(px,py);
    if(pt && (pt.free || pt.sub==='onObject' || pt.sub==='fixedLen')){ dragGeoPoint=pt; gcanvas.setPointerCapture(ev.pointerId); return; }
    gDragging=true; gDragMoved=false; gDragLast={x:ev.clientX,y:ev.clientY};
    gcanvas.setPointerCapture(ev.pointerId);
    return;
  }
  gDragging=true; gDragMoved=false; gDragLast={x:ev.clientX,y:ev.clientY};
});
gcanvas.addEventListener('pointermove', function(ev){
  var rect=gcanvas.getBoundingClientRect();
  var px=ev.clientX-rect.left, py=ev.clientY-rect.top;
  if(dragGeoPoint){
    var m=gScreenToMath(px,py);
    if(dragGeoPoint.sub==='onObject'){
      var dragTarget=byId(dragGeoPoint.deps[0]);
      if(dragTarget){ dragGeoPoint.t=paramForPointOnObject(dragTarget, m); }
    } else if(dragGeoPoint.sub==='fixedLen'){
      var dragCenter=getPt(dragGeoPoint.deps[0]);
      if(dragCenter){ dragGeoPoint.angle=Math.atan2(m.y-dragCenter.y, m.x-dragCenter.x); }
    } else {
      dragGeoPoint.x=m.x; dragGeoPoint.y=m.y;
    }
    recomputeAllGeo(); renderGeoList(); geoRender();
    return;
  }
  if(gDragging && gDragLast && currentTool==='move'){
    var dx=ev.clientX-gDragLast.x, dy=ev.clientY-gDragLast.y;
    if(Math.abs(dx)>2||Math.abs(dy)>2) gDragMoved=true;
    gview.cx -= dx/gview.scale; gview.cy += dy/gview.scale;
    gDragLast={x:ev.clientX,y:ev.clientY};
    geoRender();
  }
});
function gEndDrag(ev){
  if(dragGeoPoint){ dragGeoPoint=null; recomputeAllGeo(); renderGeoList(); geoRender(); return; }
  if(currentTool==='move'){ gDragging=false; gDragLast=null; return; }
  if(!gDragMoved){
    var rect=gcanvas.getBoundingClientRect();
    var px=ev.clientX-rect.left, py=ev.clientY-rect.top;
    handleToolClick(px,py);
  }
  gDragging=false; gDragMoved=false;
}
gcanvas.addEventListener('pointerup', gEndDrag);
gcanvas.addEventListener('pointercancel', function(){ gDragging=false; dragGeoPoint=null; });
gcanvas.addEventListener('dblclick', function(){
  if(currentTool==='polyline' && pendingClicks.length>=2){
    addShape('polyline', pendingClicks.map(function(c){return c.obj.id;}));
    pendingClicks=[]; renderGeoList(); geoRender(); updateToolStatus();
  } else if(currentTool==='bestFitLine' && pendingClicks.length>=2){
    addShape('line', pendingClicks.map(function(c){return c.obj.id;}), {sub:'bestFit'});
    pendingClicks=[]; renderGeoList(); geoRender(); updateToolStatus();
  } else if(currentTool==='vectorPolygon' && pendingClicks.length>=2){
    addShape('polygon', pendingClicks.map(function(c){return c.obj.id;}), {sub:'vectorChain'});
    pendingClicks=[]; renderGeoList(); geoRender(); updateToolStatus();
  }
});

function addRigidPolygon(ids){
  var pts=ids.map(getPt);
  var cx=pts.reduce(function(s,p){return s+p.x;},0)/pts.length;
  var cy=pts.reduce(function(s,p){return s+p.y;},0)/pts.length;
  var center=addFreePoint(cx,cy);
  return addShape('polygon', [], {sub:'rigid', centerId:center.id, offsets: pts.map(function(p){return {x:p.x-cx,y:p.y-cy};})});
}
function handleToolClick(px,py){
  if(currentTool==='point'){ resolvePointClick(px,py); renderGeoList(); geoRender(); return; }
  if(currentTool==='complexPoint'){
    var cm=gScreenToMath(px,py);
    var cp=addFreePoint(cm.x,cm.y);
    cp.sub='complex';
    renderGeoList(); geoRender();
    return;
  }
  var spec=TOOLS.find(function(t){return t.id===currentTool;});
  if(!spec) return;

  if(spec.id==='polygon'||spec.id==='rigidPolygon'){
    if(pendingClicks.length>=3){
      var first=pendingClicks[0];
      var s0=gMathToScreen(first.obj.x,first.obj.y);
      if(Math.hypot(s0.x-px,s0.y-py)<14){
        var ids=pendingClicks.map(function(c){return c.obj.id;});
        if(spec.id==='polygon') addShape('polygon', ids);
        else addRigidPolygon(ids);
        pendingClicks=[]; renderGeoList(); geoRender(); updateToolStatus();
        return;
      }
    }
    var p=resolvePointClick(px,py);
    pendingClicks.push({obj:p});
    updateToolStatus(); geoRender();
    return;
  }

  if(spec.id==='polyline'||spec.id==='bestFitLine'){
    var pl=resolvePointClick(px,py);
    pendingClicks.push({obj:pl});
    updateToolStatus(); geoRender();
    return;
  }

  if(spec.id==='vectorPolygon'){
    if(pendingClicks.length===0){
      var vpStart=resolvePointClick(px,py);
      pendingClicks.push({obj:vpStart});
    } else {
      var vpVec=findVectorNear(px,py);
      if(vpVec) pendingClicks.push({obj:vpVec});
    }
    updateToolStatus(); geoRender();
    return;
  }

  if(spec.id==='attachDetach' && pendingClicks.length===0){
    var adExisting=findPointNear(px,py);
    if(adExisting && adExisting.sub==='onObject'){
      adExisting.free=true; adExisting.sub=undefined; adExisting.deps=undefined; adExisting.t=undefined;
      renderGeoList(); geoRender(); updateToolStatus();
      return;
    }
  }

  var kind=spec.kinds[pendingClicks.length];
  var obj = kind==='line' ? findLineNear(px,py)
    : kind==='circle' ? findCircleNear(px,py)
    : kind==='curve' ? findCurveNear(px,py)
    : kind==='vector' ? findVectorNear(px,py)
    : kind==='function' ? findFunctionNear(px,py)
    : resolvePointClick(px,py);
  if(!obj){ return; }
  pendingClicks.push({obj:obj, m:gScreenToMath(px,py)});
  if(pendingClicks.length>=spec.arity){ finishTool(spec); }
  else { updateToolStatus(); geoRender(); }
}

/* wheel / zoom for geometry canvas */
gcanvas.addEventListener('wheel', function(ev){
  ev.preventDefault();
  var rect=gcanvas.getBoundingClientRect();
  var px=ev.clientX-rect.left, py=ev.clientY-rect.top;
  var before=gScreenToMath(px,py);
  var factor=Math.pow(1.0016,-ev.deltaY);
  gview.scale=Math.min(200000,Math.max(0.001, gview.scale*factor));
  var after=gScreenToMath(px,py);
  gview.cx += before.x-after.x; gview.cy += before.y-after.y;
  geoRender();
}, {passive:false});

document.getElementById('geoZoomIn').addEventListener('click', function(){ gview.scale*=1.4; geoRender(); });
document.getElementById('geoZoomOut').addEventListener('click', function(){ gview.scale/=1.4; geoRender(); });
document.getElementById('geoZoomHome').addEventListener('click', function(){ gview.cx=0; gview.cy=0; gview.scale=50; geoRender(); });

/* command bar */
var geoCommandInput=document.getElementById('geoCommandInput');
var CMD_RE=/^([A-Za-z][A-Za-z0-9]*)\((.*)\)$/;
function evalNumericArg(text){
  var eng=window.MathEngine;
  var ast=eng.parseExpression(text.trim());
  return eng.compile(ast,{})({});
}
function resolveArg(text){
  text=text.trim();
  var pt=byLabel(text);
  if(pt) return pt;
  return {__num: evalNumericArg(text)};
}
var FUNC_DEF_RE=/^[A-Za-z][A-Za-z0-9]*\(x\)\s*=\s*(.+)$/;
var COMPLEX_LIT_RE=/^-?\d+(\.\d+)?\s*([+-])\s*\d+(\.\d+)?i$|^-?\d+(\.\d+)?i$/;
function runCommand(text){
  text=text.trim();
  if(!text) return;
  var fdm=text.match(FUNC_DEF_RE);
  if(fdm){
    try{ createFunctionObject(fdm[1].trim()); }
    catch(e){ setToolStatus('Error: '+(e.message||e)); setTimeout(updateToolStatus,2200); }
    renderGeoList(); geoRender();
    return;
  }
  if(COMPLEX_LIT_RE.test(text)){
    try{
      var cx=0, cyv=0;
      var pureImag=text.match(/^(-?\d+(?:\.\d+)?)i$/);
      if(pureImag){ cyv=parseFloat(pureImag[1]); }
      else {
        var cparts=text.match(/^(-?\d+(?:\.\d+)?)\s*([+-])\s*(\d+(?:\.\d+)?)i$/);
        cx=parseFloat(cparts[1]); cyv=parseFloat(cparts[3])*(cparts[2]==='-'?-1:1);
      }
      var cpp=addFreePoint(cx,cyv); cpp.sub='complex';
    } catch(e){ setToolStatus('Error: '+(e.message||e)); setTimeout(updateToolStatus,2200); }
    renderGeoList(); geoRender();
    return;
  }
  var m=text.match(CMD_RE);
  if(!m){ setToolStatus('Could not understand: '+text); setTimeout(updateToolStatus,1800); return; }
  var name=m[1].toLowerCase();
  var argStrs=splitTopCommaG(m[2]);
  try{
    if(name==='point'){
      if(argStrs.length===1 && byLabel(argStrs[0].trim())){
        var ptTarget=byLabel(argStrs[0].trim());
        recomputeOne(ptTarget);
        var opc=addDerivedPoint('onObject',[ptTarget.id], function(){return {x:0,y:0};});
        opc.t=0.15; recomputeOne(opc);
      } else {
        var x=evalNumericArg(argStrs[0]), y=evalNumericArg(argStrs[1]);
        addFreePoint(x,y);
      }
    } else if(name==='midpoint'){
      addDerivedPoint('midpoint',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id], computeMidpoint);
    } else if(name==='segment'){
      var sA=byLabel(argStrs[0]);
      var sB=byLabel(argStrs[1]);
      if(sB){ addShape('segment',[sA.id, sB.id]); }
      else {
        var slen=evalNumericArg(argStrs[1]);
        var snp=addDerivedPoint('fixedLen',[sA.id], function(){return {x:0,y:0};});
        snp.value=slen; snp.angle=0; recomputeOne(snp);
        addShape('segment',[sA.id, snp.id]);
      }
    }
    else if(name==='line'){ addShape('line',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id]); }
    else if(name==='ray'){ addShape('ray',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id]); }
    else if(name==='vector'){ addShape('vector',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id]); }
    else if(name==='vectorfrompoint'){ addShape('vector',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id],{sub:'fromPoint'}); }
    else if(name==='circle'){
      var center=byLabel(argStrs[0]);
      if(argStrs.length===3){ addShape('circle',[center.id, byLabel(argStrs[1]).id, byLabel(argStrs[2]).id],{sub:'through3'}); }
      else {
        var second=byLabel(argStrs[1]);
        if(second) addShape('circle',[center.id, second.id]);
        else addShape('circle',[center.id, null],{fixedRadius:evalNumericArg(argStrs[1])});
      }
    } else if(name==='semicircle'){ addShape('arc',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id],{sub:'semicircle'}); }
    else if(name==='circulararc'){ addShape('arc',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id, byLabel(argStrs[2]).id],{sub:'arc'}); }
    else if(name==='circumcirculararc'){ addShape('arc',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id, byLabel(argStrs[2]).id],{sub:'circumArc'}); }
    else if(name==='circlesector'){ addShape('arc',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id, byLabel(argStrs[2]).id],{sub:'sector'}); }
    else if(name==='circumcircularsector'){ addShape('arc',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id, byLabel(argStrs[2]).id],{sub:'circumSector'}); }
    else if(name==='ellipse'){ addShape('conic',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id, byLabel(argStrs[2]).id],{sub:'ellipse'}); }
    else if(name==='hyperbola'){ addShape('conic',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id, byLabel(argStrs[2]).id],{sub:'hyperbola'}); }
    else if(name==='parabola'){ addShape('conic',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id],{sub:'parabola'}); }
    else if(name==='polygon'){ addShape('polygon', argStrs.map(function(s){return byLabel(s.trim()).id;})); }
    else if(name==='regularpolygon'){ addShape('polygon',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id],{sub:'regular', value:Math.max(3,Math.round(evalNumericArg(argStrs[2])))}); }
    else if(name==='polyline'){ addShape('polyline', argStrs.map(function(s){return byLabel(s.trim()).id;})); }
    else if(name==='angle'){
      if(argStrs.length===3 && !byLabel(argStrs[2].trim())){
        var apA=byLabel(argStrs[0]), apB=byLabel(argStrs[1]);
        var apO=addDerivedPoint('rotate',[apA.id,apB.id], function(p,c,v){return computeRotate(p,c,v);});
        apO.value=evalNumericArg(argStrs[2]); recomputeOne(apO);
        addShape('angle',[apA.id,apB.id,apO.id]);
      } else {
        addShape('angle',[byLabel(argStrs[0]).id,byLabel(argStrs[1]).id,byLabel(argStrs[2]).id]);
      }
    }
    else if(name==='intersect'){
      var xA=byLabel(argStrs[0]), xB=byLabel(argStrs[1]);
      recomputeOne(xA); recomputeOne(xB);
      var xpts=computeIntersection(xA,xB);
      xpts.forEach(function(pt,idx){ var xp=addDerivedPoint('intersect',[xA.id,xB.id], function(){return{x:0,y:0};}); xp.idx=idx; recomputeOne(xp); });
    }
    else if(name==='tangent'){
      var tgP=byLabel(argStrs[0]), tgC=byLabel(argStrs[1]);
      recomputeOne(tgC);
      var tgpts=computeTangentPoints({x:tgP.x,y:tgP.y}, tgC.center, tgC.radius);
      tgpts.forEach(function(pt,idx){ var tll=addShape('line',[tgP.id,tgC.id],{sub:'tangent'}); tll.idx=idx; recomputeOne(tll); });
    }
    else if(name==='perpendicular'){ addShape('line',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id],{sub:'perpendicular'}); }
    else if(name==='parallel'){ addShape('line',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id],{sub:'parallel'}); }
    else if(name==='perpendicularbisector'){ addShape('line',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id],{sub:'perpBisector'}); }
    else if(name==='anglebisector'){ addShape('line',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id, byLabel(argStrs[2]).id],{sub:'angleBisector'}); }
    else if(name==='median'){ addShape('segment',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id],{sub:'median'}); }
    else if(name==='altitude'){ addShape('segment',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id],{sub:'altitude'}); }
    else if(name==='reflect'){ addDerivedPoint('reflect',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id], function(p,l){return computeReflect(p,l);}); }
    else if(name==='reflectpoint'){ addDerivedPoint('reflectPoint',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id], function(p,c){return computeReflectPoint(p,c);}); }
    else if(name==='reflectcircle'){ addDerivedPoint('reflectCircle',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id], function(){return {x:0,y:0};}); }
    else if(name==='rotate'){
      var o=addDerivedPoint('rotate',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id], function(p,c,v){return computeRotate(p,c,v);});
      o.value=evalNumericArg(argStrs[2]); recomputeOne(o);
    } else if(name==='translate'){ addDerivedPoint('translate',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id, byLabel(argStrs[2]).id], computeTranslate); }
    else if(name==='dilate'){
      var o2=addDerivedPoint('dilate',[byLabel(argStrs[0]).id, byLabel(argStrs[1]).id], function(p,c,v){return computeDilate(p,c,v);});
      o2.value=evalNumericArg(argStrs[2]); recomputeOne(o2);
    } else if(name==='slope'){
      addShape('measure',[byLabel(argStrs[0]).id],{sub:'slope'});
    } else if(name==='distance'){
      var distA=byLabel(argStrs[0]), distB=byLabel(argStrs[1]);
      addShape('measure',[distA.id, distB.id],{sub:'distance'});
    } else if(name==='locus'){
      var locTc=byLabel(argStrs[0]), locDc=byLabel(argStrs[1]);
      if(locDc.sub!=='onObject'){ setToolStatus('Second point must be a point on an object'); setTimeout(updateToolStatus,2200); }
      else addShape('locus',[locTc.id, locDc.id]);
    } else if(name==='root'){
      var rFnc=byLabel(argStrs[0]);
      var rLeftc=gScreenToMath(0,0).x, rRightc=gScreenToMath(gcssW,0).x;
      findFunctionRoots(rFnc.fn, rLeftc, rRightc).forEach(function(rx){
        geoObjects.push({id:gid(), label:nextLabel(UPPER), type:'point', free:false, sub:'root', deps:[rFnc.id], x:rx, y:0, color:'#3c3c3c', visible:true});
      });
    } else if(name==='extremum'){
      var eFnc=byLabel(argStrs[0]);
      var eLeftc=gScreenToMath(0,0).x, eRightc=gScreenToMath(gcssW,0).x;
      findFunctionExtrema(eFnc.fn, eLeftc, eRightc).forEach(function(ep){
        geoObjects.push({id:gid(), label:nextLabel(UPPER), type:'point', free:false, sub:'extremum', deps:[eFnc.id], x:ep.x, y:ep.y, color:'#3c3c3c', visible:true});
      });
    } else if(name==='attachpoint'){
      var adPtc=byLabel(argStrs[0]), adCurvec=byLabel(argStrs[1]);
      recomputeOne(adCurvec);
      adPtc.free=false; adPtc.sub='onObject'; adPtc.deps=[adCurvec.id];
      adPtc.t=paramForPointOnObject(adCurvec, {x:adPtc.x,y:adPtc.y});
      recomputeOne(adPtc);
    } else if(name==='detachpoint'){
      var adDc=byLabel(argStrs[0]);
      adDc.free=true; adDc.sub=undefined; adDc.deps=undefined; adDc.t=undefined;
    } else if(name==='bestfitline'){
      addShape('line', argStrs.map(function(s){return byLabel(s.trim()).id;}), {sub:'bestFit'});
    } else if(name==='rigidpolygon'){
      addRigidPolygon(argStrs.map(function(s){return byLabel(s.trim()).id;}));
    } else if(name==='vectorpolygon'){
      addShape('polygon', argStrs.map(function(s){return byLabel(s.trim()).id;}), {sub:'vectorChain'});
    } else if(name==='complex'){
      var ccp=addFreePoint(evalNumericArg(argStrs[0]), evalNumericArg(argStrs[1])); ccp.sub='complex';
    } else { setToolStatus('Unknown command: '+name); setTimeout(updateToolStatus,1800); }
  }catch(e){ setToolStatus('Error: '+(e.message||e)); setTimeout(updateToolStatus,2200); }
  renderGeoList(); geoRender();
}
function splitTopCommaG(src){
  var depth=0, parts=[], cur='';
  for(var i=0;i<src.length;i++){
    var c=src[i];
    if('([{'.indexOf(c)!==-1) depth++;
    if(')]}'.indexOf(c)!==-1) depth--;
    if(c===',' && depth===0){ parts.push(cur); cur=''; continue; }
    cur+=c;
  }
  parts.push(cur);
  return parts;
}
geoCommandInput.addEventListener('keydown', function(ev){
  if(ev.key==='Enter'){ runCommand(geoCommandInput.value); geoCommandInput.value=''; }
});

document.getElementById('geoClearBtn').addEventListener('click', function(ev){
  ev.stopPropagation();
  if(geoObjects.length===0) return;
  geoObjects.length=0;
  pendingClicks=[];
  geoIdCounter=1;
  paletteCursorG=0;
  selectTool('move');
  renderGeoList();
  geoRender();
  setToolStatus(null);
});

document.addEventListener('keydown', function(ev){
  if(document.activeElement===geoCommandInput) return;
  if(window.__currentAppMode!=='geometry') return;
  if(ev.key==='Escape'){ pendingClicks=[]; selectTool('move'); }
});

window.geoResizeCanvas=geoResizeCanvas;
window.geoRender=geoRender;
Object.defineProperty(window, '__debugGeo', { get: function(){ return geoObjects; }, configurable:true });
})();
</script>

<script>
(function(){
"use strict";
/* ============================== CALCULATOR MODE ============================== */

var calcHistoryEl=document.getElementById('calcHistory');
var calcInputEl=document.getElementById('calcInput');
var calcPreviewEl=document.getElementById('calcPreview');
var calcPadEl=document.getElementById('calcPad');

var calcHistory=[]; // {expr, val}
var calcLastAns=0;

function calcFormat(v){
  if(typeof v!=='number') return String(v);
  if(!isFinite(v)) return v>0?'Infinity':(v<0?'-Infinity':'undefined');

    var v=document.createElement('span'); v.className='h-val'; v.textContent='= '+calcFormat(h.val);

  calcInputEl.focus();
  calcUpdatePreview();
}

  {l:'1', v:'1'}, {l:'2', v:'2'}, {l:'3', v:'3'}, {l:'−', v:'-', cls:'op'}, {l:'π', v:'pi'},
  {l:'0', v:'0'}, {l:'.', v:'.'}, {l:'Ans', v:'Ans'}, {l:'+', v:'+', cls:'op'}, {l:'=', act:calcCommit, cls:'eq'}

function calcBuildPad(){

  CALC_KEYS.forEach(function(k){
    var b=document.createElement('button');
    b.textContent=k.l;
    if(k.cls) b.className=k.cls;

calcInputEl.addEventListener('input', calcUpdatePreview);
calcInputEl.addEventListener('keydown', function(ev){
  if(ev.key==='Enter'){ ev.preventDefault(); calcCommit(); }

window.__debugCalcHistory=function(){ return calcHistory; };
})();

<script>
(function(){
"use strict";
/* ============================== SPREADSHEET MODE ============================== */

var NUM_COLS=12, NUM_ROWS=40;
var cells={};         // ref -> {raw, value, error}
var cellInputs={};    // ref -> <input>
var cellTds={};       // ref -> <td>
var selectedRef='A1';

function colToIndex(letters){
  var n=0;
  for(var i=0;i<letters.length;i++) n=n*26+(letters.charCodeAt(i)-64);

function indexToCol(n){

function parseRef(ref){

function rangeCells(fromRef,toRef){
  var a=parseRef(fromRef), b=parseRef(toRef);

  var c0=Math.min(a.col,b.col), c1=Math.max(a.col,b.col);
  var r0=Math.min(a.row,b.row), r1=Math.max(a.row,b.row);
  var out=[];
  for(var r=r0;r<=r1;r++) for(var c=c0;c<=c1;c++) out.push(indexToCol(c)+r);
  return out;
}

/* ---- tokenizer ---- */
function sheetTokenize(src){
  var toks=[], i=0, n=src.length;
  while(i<n){
    var c=src[i];
    if(c===' '||c==='\t'){ i++; continue; }
    if((c>='0'&&c<='9') || (c==='.'&&src[i+1]>='0'&&src[i+1]<='9')){
      var j=i, seenDot=false;
      while(j<n && ((src[j]>='0'&&src[j]<='9') || (src[j]==='.'&&!seenDot))){ if(src[j]==='.') seenDot=true; j++; }
      toks.push({t:'num', v:parseFloat(src.slice(i,j))}); i=j; continue;
    }
    if(c==='"'){
      var j=i+1, buf='';
      while(j<n && src[j]!=='"'){ buf+=src[j]; j++; }

      var j=i;
      while(j<n && /[A-Za-z0-9]/.test(src[j])) j++;
      toks.push({t:'id', v:src.slice(i,j).toUpperCase()}); i=j; continue;
    }
    if(c==='<'){
      if(src[i+1]==='='){ toks.push({t:'cmp',v:'<='}); i+=2; continue; }
      if(src[i+1]==='>'){ toks.push({t:'cmp',v:'<>'}); i+=2; continue; }
      toks.push({t:'cmp',v:'<'}); i++; continue;
    }
    if(c==='>'){
      if(src[i+1]==='='){ toks.push({t:'cmp',v:'>='}); i+=2; continue; }
      toks.push({t:'cmp',v:'>'}); i++; continue;
    }
    if(c==='='){ toks.push({t:'cmp',v:'='}); i++; continue; }
    if('+-*/^%(),:&'.indexOf(c)!==-1){ toks.push({t:c}); i++; continue; }

/* ---- parser ---- */
function sheetParse(toks){
  var pos=0;
  function peek(){ return toks[pos]; }
  function next(){ return toks[pos++]; }
  function atEnd(){ return pos>=toks.length; }

  }

  function parsePower(){
    var node=parseAtom();

  }
  function parseAtom(){
    if(atEnd()) throw new Error('#ERROR! unexpected end');
    var tok=next();
    if(tok.t==='num') return {type:'num', v:tok.v};
    if(tok.t==='str') return {type:'str', v:tok.v};
    if(tok.t==='('){
      var e=parseExpr();
      if(atEnd()||next().t!==')') throw new Error("#ERROR! expected ')'");
      return e;
    }
    if(tok.t==='id'){
      var name=tok.v;
      var isRef=/^[A-Z]+[0-9]+$/.test(name);
      if(!atEnd() && peek().t==='(' && !isRef){
        next();

        if(!(!atEnd() && peek().t===')')){
          args.push(parseExpr());
          while(!atEnd() && peek().t===','){ next(); args.push(parseExpr()); }
        }
        if(atEnd()||next().t!==')') throw new Error("#ERROR! expected ')'");
        return {type:'call', name:name, args:args};
      }
      if(isRef){
        if(!atEnd() && peek().t===':'){
          next();
          if(atEnd()||toks[pos].t!=='id'||!/^[A-Z]+[0-9]+$/.test(toks[pos].v)) throw new Error('#ERROR! bad range');
          var to=next().v;
          return {type:'range', from:name, to:to};
        }
        return {type:'ref', ref:name};
      }
      if(name==='PI') return {type:'num', v:Math.PI};
      if(name==='E') return {type:'num', v:Math.E};

      if(name==='FALSE') return {type:'bool', v:false};
      throw new Error("#NAME? "+name);
    }
    throw new Error('#ERROR! unexpected token');
  }
  var result=parseExpr();
  if(!atEnd()) throw new Error('#ERROR! trailing input');
  return result;
}

/* ---- evaluator ---- */
function sheetToStr(v){
  if(typeof v==='number') return sheetFormatNum(v);
  if(typeof v==='boolean') return v?'TRUE':'FALSE';
  return String(v);
}
function evalCellValue(ref, visiting, memo){
  if(memo.has(ref)) return memo.get(ref);
  if(visiting.has(ref)){ var c={error:'#CIRC!'}; memo.set(ref,c); return c; }

  if(!cell || cell.raw===undefined || cell.raw===''){
    result={value:0};
  } else if(cell.raw[0]!=='='){
    var num=Number(cell.raw);
    result = (cell.raw.trim()!=='' && !isNaN(num)) ? {value:num} : {value:cell.raw};

    visiting.add(ref);

      var toks=sheetTokenize(cell.raw.slice(1));

}
function evalNode(node, ctx){
  switch(node.type){
    case 'num': return node.v;
    case 'str': return node.v;
    case 'bool': return node.v;
    case 'neg': { var a=evalNode(node.a,ctx); if(typeof a!=='number') throw new Error('#VALUE!'); return -a; }
    case 'bin': {
      var l=evalNode(node.l,ctx), r=evalNode(node.r,ctx);
      if(typeof l!=='number'||typeof r!=='number') throw new Error('#VALUE!');
      if(node.op==='+') return l+r;
      if(node.op==='-') return l-r;
      if(node.op==='*') return l*r;
      if(node.op==='/') return l/r;
      if(node.op==='%') return l%r;
      if(node.op==='^') return Math.pow(l,r);
      throw new Error('#ERROR!');
    }
    case 'concat': return sheetToStr(evalNode(node.l,ctx))+sheetToStr(evalNode(node.r,ctx));
    case 'cmp': {
      var l2=evalNode(node.l,ctx), r2=evalNode(node.r,ctx);
      if(node.op==='=') return l2===r2;
      if(node.op==='<>') return l2!==r2;
      if(typeof l2!=='number'||typeof r2!=='number') throw new Error('#VALUE!');
      if(node.op==='<') return l2<r2;
      if(node.op==='>') return l2>r2;
      if(node.op==='<=') return l2<=r2;
      if(node.op==='>=') return l2>=r2;
      throw new Error('#ERROR!');
    }
    case 'ref': {
      var v=evalCellValue(node.ref, ctx.visiting, ctx.memo);
      if(v.error) throw new Error(v.error);
      return v.value;
    }

    case 'call': return evalSheetCall(node, ctx);

}
function flattenNumeric(node, ctx){
  if(node.type==='range'){
    var out=[];
    rangeCells(node.from,node.to).forEach(function(ref){
      var v=evalCellValue(ref, ctx.visiting, ctx.memo);
      if(!v.error && typeof v.value==='number') out.push(v.value);
    });

  }
  try{ var v2=evalNode(node,ctx); return typeof v2==='number' ? [v2] : []; }

}
function scalarArg(node, idx, ctx){
  var a=node.args[idx];
  if(!a) throw new Error('#VALUE!');
  var v=evalNode(a,ctx);
  if(typeof v!=='number') throw new Error('#VALUE!');
  return v;
}
function evalSheetCall(node, ctx){
  var name=node.name;

function sheetFormatNum(v){
  if(!isFinite(v)) return v>0?'Infinity':(v<0?'-Infinity':'NaN');
  if(Math.abs(v)<1e-12) v=0;

function sheetFormatValue(cell){

  if(typeof v==='boolean') return v?'TRUE':'FALSE';

function sheetRecomputeAll(){

    input.value=sheetFormatValue(cells[ref]);
    cellTds[ref].classList.toggle('sheet-error', !!(cells[ref]&&cells[ref].error));

function sheetSelect(ref){
  if(cellTds[selectedRef]) cellTds[selectedRef].classList.remove('sheet-selected');
  selectedRef=ref;
  if(cellTds[ref]) cellTds[ref].classList.add('sheet-selected');
  document.getElementById('sheetCellRef').textContent=ref;
  document.getElementById('sheetFormulaInput').value=(cells[ref]&&cells[ref].raw)||'';
}
function sheetCommitInput(ref, rawText){
  cells[ref].raw=rawText;

}

    if(pos.row>1) sheetMoveTo(indexToCol(pos.col)+(pos.row-1));
